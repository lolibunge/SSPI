function permitted(a){if(mode!=='team')return true;const k=a.split(':')[0];if(k==='decision-reason')return role==='partner';if(['approve','publish','return-report','review-report','validate','reject','reassign','validate-measurement'].includes(k))return role!=='assistant';if(['pay','user','invite','won','new-opportunity','proposal','permissions'].includes(k))return role==='partner';if(['new-project'].includes(k))return role!=='assistant';if(['escalate'].includes(k))return role==='manager';if(k==='resolve-escalation')return role==='partner';return true}

function scopedView(){const original=state;if(mode==='team'){const projects=visibleProjects();const ids=projects.map(x=>x.id);state={...state,projects,tasks:state.tasks.filter(t=>ids.includes(t.project)&&(role!=='assistant'||t.owner==='Lucía Pérez')),requests:state.requests.filter(r=>ids.includes(r.project))};}try{return views[route]?views[route]():views.home()}finally{state=original}}
function switchRole(next){if(!roles[next])return;role=next;try{localStorage.setItem('ss-demo-role',role)}catch{}close();filter=healthFilter=ownerFilter=taskFilter='';if(!allowedRoute(route)||route==='project'&&!allowedProject(pid))route='home';render();notify('Vista '+roles[role].label+': '+roles[role].scope)}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'USD '+Number(v).toLocaleString('es-UY');const date=s=>new Date(s+'T12:00:00').toLocaleDateString('es-UY',{day:'2-digit',month:'short'});
const p=()=>state.projects.find(x=>x.id===pid)||state.projects[0];const req=()=>state.requests.find(x=>x.id===rid)||state.requests[0];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{} }
function notify(s){const e=document.getElementById('toast');e.className='toast';e.textContent=s;clearTimeout(notify.timer);notify.timer=setTimeout(()=>{e.className='';e.textContent=''},4500)}
function log(s){state.events.unshift('05 oct · '+s);save()}
function badge(s){return `<span class="badge ${/riesgo|Vencida|Rechazado/.test(s)?'red':/Pendiente|viejo|revisión|Parcial|Bloqueada/.test(s)?'amber':''}">${esc(s)}</span>`}
function button(s,action,primary=false){if(!permitted(action))return '';return `<button class="${primary?'primary':''}" data-action="${action}">${s}</button>`}
function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function metric(label,val){return `<div class="metric"><div class="label"><span>${label}</span><b>${val}%</b></div><div class="bar"><i style="width:${Math.min(val,100)}%"></i></div></div>`}
function kpi(title,value,detail){return `<div class="kpi"><span class="small">${title}</span><strong>${value}</strong><span class="small">${detail}</span></div>`}
function table(heads,rows){return `<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${heads.length}"><div class="empty">No hay resultados para esta selección.</div></td></tr>`}</tbody></table></div>`}
function field(label,name,val='',type='text',required=false){return `<div><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(val)}" ${required?'required':''}></div>`}
function go(r,id){close();if(!allowedRoute(r)){notify('Esta sección no está disponible para '+roles[role].label+'.');return}if(r==='project'&&id&&!allowedProject(id)){notify('Este expediente está fuera del alcance del rol.');return}route=r;if(id)pid=Number(id);if(mode==='client'&& !['portal','client-project','client-requests','client-reports','account','guide','login'].includes(route))route='portal';if(mode==='client')pid=1;tab='Resumen';location.hash=mode+'/'+route+(r==='project'?'/'+pid:'');render();window.scrollTo(0,0)}

assistant:[['home','✓','Mi cola del día'],['tasks','▤','Mis tareas'],['portfolio','▦','Mis expedientes'],['requests','↗','Pedidos de información'],['documents','▧','Documentos y evidencias']],
manager:[['home','◫','Centro de excepciones'],['portfolio','▤','Cartera supervisada'],['team-load','▦','Carga del equipo'],['calendar','▣','Vencimientos'],['requests','↗','Control de solicitudes'],['reviews','◎','Revisiones y validaciones'],['reports','▧','Informes del equipo']],
partner:[['home','◫','Resumen ejecutivo'],['analytics','▦','Indicadores de cartera'],['decisions','◎','Decisiones escaladas'],['portfolio','▤','Cartera global'],['billing','$','Facturación y cobranza'],['commercial','◇','Comercial'],['admin','⚙','Usuarios y accesos']]
};
const clientNav=[['portal','◫','Mis proyectos'],['client-requests','↗','Mis solicitudes'],['client-reports','▧','Mis informes'],['account','◎','Mi cuenta']];
function render(){if(!allowedRoute(route)||mode==='team'&&route==='project'&&!allowedProject(pid))route=mode==='team'?'home':'portal';if(mode==='client'&&!['portal','client-project','client-requests','client-reports','account','guide','login'].includes(route))route='portal';if(route==='login'){renderLogin();return}const nav=mode==='team'?roleNav[role]:clientNav;let body=scopedView();document.getElementById('app').innerHTML=`<aside id="sidebar"><div class="brand">SS<small>PROYECTOS</small></div><p class="small" style="color:#b8c6df;margin-top:20px">${mode==='team'?(role==='assistant'?'Operación diaria':role==='manager'?'Supervisión del equipo':'Dirección y estrategia'):'Portal del cliente'}</p><nav class="nav" aria-label="Principal">${nav.map(([r,i,l])=>`<button data-route="${r}" class="${route===r||(route==='project'&&r==='portfolio')||(route==='client-project'&&r==='portal')?'active':''}"><span class="ico" aria-hidden="true">${i}</span>${l}</button>`).join('')}<button data-route="guide"><span class="ico">?</span>Guía de la demo</button></nav><div class="profile"><span class="avatar">${mode==='team'?roles[role].initials:'ML'}</span>${mode==='team'?roles[role].name:esc(state.profile.name)}<div class="small" style="color:#b8c6df;margin:8px 0">${mode==='team'?roles[role].label+' · Equipo SS':'Río Sur S.A. · Cliente'}</div><button data-route="login" style="padding:5px 10px;min-height:32px">Salir de la demo</button></div></aside><div class="main"><header><button class="mobile-menu" data-action="menu" aria-label="Abrir menú">☰</button><input class="search" id="global-search" placeholder="Buscar empresa o expediente…" aria-label="Buscar empresa o expediente"><span class="badge gray">DEMO</span><button class="mode" data-action="switch">${mode==='team'?'Ver como cliente ↗':'Volver al equipo ↗'}</button></header><main>${mode==='team'?`<div class="role-context"><div><b>VISTA DEL EQUIPO · Elegí un rol</b><div class="small">${roles[role].scope}</div></div>${roleToggle()}</div>`:''}${body}<div class="demo-note">Prototipo local · Datos de demostración · Envíos, autenticación y archivos simulados. Los cambios se guardan en este navegador cuando está disponible. Ninguna operación contacta a clientes reales.</div></main></div>`}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${mode==='team'?roles[role].label+' · SS Proyectos':'Río Sur S.A.'}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function projectRows(list){return list.map(x=>`<tr class="rowlink" data-project="${x.id}" tabindex="0"><td>${esc(x.company)}<div class="small">${esc(x.name)}</div></td><td>${x.exp}</td><td>${x.owner}</td><td>${badge(x.health)}</td><td>${esc(x.next)}<div class="small">${date(x.date)}</div></td><td><button data-project="${x.id}">Abrir →</button></td></tr>`)}
function requestStatus(r){return r.items.every(x=>x.status==='Validado')?'Completa':r.items.some(x=>['Recibido','Validado'].includes(x.status))?'Parcial':'Abierta'}
function reportPreview(){return `<div class="report"><div class="eyebrow">SS Proyectos · Septiembre 2026</div><h2>Informe de seguimiento</h2><p class="sub">Río Sur S.A. · Ampliación de planta · Exp. 024 / 2026</p><h2>Resumen ejecutivo</h2><p>La inversión ejecutada asciende a <b>${money(state.projects[0].executed)}</b> sobre ${money(state.projects[0].investment)} comprometidos. El indicador de empleo registra ${state.projects[0].jobs} de ${state.projects[0].target} unidades y requiere seguimiento.</p><h2>Próximos pasos</h2><p>Solicitar la medición actualizada, validar la documentación de respaldo y documentar las acciones acordadas con la empresa antes del 12 de octubre.</p><h2>Conclusión del asesor</h2><p>Continuar el seguimiento del proyecto y revisar los compromisos aplicables con la información validada del período.</p><p class="small" style="margin-top:25px">Valores ficticios. Este informe demuestra formato y flujo; no constituye asesoramiento fiscal.</p></div>`}
const views={
home(){return heading('Buenos días, Ana','Tu cartera y las acciones que necesitan atención.',button('Recorrer la demo','tour',true))+`<div class="tour"><div><h2>Del expediente al siguiente paso.</h2><p>Detectá el riesgo, pedí información y seguí la entrega desde el portal del cliente.</p></div>${button('Abrir Río Sur →','open-main')}</div><div class="grid kpis">${kpi('Proyectos activos',state.projects.length,'Cartera de demostración')}${kpi('Requieren atención',state.projects.filter(x=>x.health!=='Al día').length,'Riesgo y datos desactualizados')}${kpi('Solicitudes abiertas',state.requests.filter(x=>requestStatus(x)!=='Completa').length,'Información por validar')}${kpi('Tareas pendientes',state.tasks.filter(x=>x.status!=='Completada').length,'Trabajo con responsable')}</div><div class="grid split">${panel('Prioridades de la cartera',table(['Sociedad / proyecto','Motivo','Próxima acción'],state.projects.filter(x=>x.health!=='Al día').map(x=>`<tr class="rowlink" data-project="${x.id}"><td>${x.company}<div class="small">${x.name}</div></td><td>${badge(x.health)}</td><td>${x.next}<div class="small">${date(x.date)}</div></td></tr>`))+`<div class="actions">${button('Ver toda la cartera','portfolio')}</div>`)}${panel('Mi agenda',state.tasks.filter(x=>x.status!=='Completada').slice(0,3).map(x=>`<div class="event"><div class="date">${date(x.date)}</div><p>${esc(x.title)}</p><div class="small">${x.owner}</div></div>`).join('')+`<div class="actions">${button('Ver mis tareas','tasks')}</div>`)}</div>`},
portfolio(){const list=state.projects.filter(x=>(x.company+' '+x.name+' '+x.exp).toLowerCase().includes(filter.toLowerCase())&&(!healthFilter||x.health===healthFilter)&&(!ownerFilter||x.owner===ownerFilter));return heading(role==='assistant'?'Mis expedientes':role==='manager'?'Cartera supervisada':'Cartera global',`${state.projects.length} expedientes · Ordenados por la atención que requieren.`,button('＋ Nuevo proyecto','new-project',true))+`<div class="filters"><input id="filter" value="${esc(filter)}" placeholder="Buscar empresa, proyecto o expediente" aria-label="Buscar cartera"><select id="health-filter" aria-label="Filtrar por salud"><option value="">Todos los estados</option>${['En riesgo','Dato viejo','Al día'].map(s=>`<option ${s===healthFilter?'selected':''}>${s}</option>`).join('')}</select><select id="owner-filter" aria-label="Filtrar por responsable"><option value="">Todo el equipo</option>${['Ana López','Lucía Pérez','Diego Silva'].map(s=>`<option ${s===ownerFilter?'selected':''}>${s}</option>`).join('')}</select></div>${panel('Proyectos de la cartera',table(['Sociedad / proyecto','Expediente','Responsable','Salud','Próxima acción',''],projectRows(list))+`<div class="pagination"><span class="small">${list.length} resultados</span>${button('Limpiar filtros','clear')}</div>`)}`},
companies(){return heading('Sociedades y contactos','Identificación, relaciones y expedientes en un solo lugar.')+panel('Sociedades',table(['Sociedad','Sector','Contactos','Expedientes',''],state.projects.map(x=>`<tr><td>${x.company}</td><td>Industria / servicios</td><td>${x.id===1?'Martín López':'Contacto de demostración'}</td><td>1 activo</td><td>${button('Ver ficha','company:'+x.id)}</td></tr>`)))},
project(){const x=p();let body='';if(tab==='Resumen')body=`<div class="grid three">${kpi('Inversión comprometida',money(x.investment),'Hasta diciembre 2027')}${kpi('Inversión ejecutada',money(x.executed),Math.round(x.executed/x.investment*100)+'% de avance')}${kpi('Beneficio aprobado',money(x.benefit),'Dato ficticio desde resolución')}</div><div class="grid split" style="margin-top:20px">${panel('Avance de compromisos',metric('Inversión',Math.round(x.executed/x.investment*100))+metric('Empleo · '+x.jobs+' de '+x.target,Math.round(x.jobs/x.target*100))+'<p class="small">Última actualización: 03 oct 2026 · Fuente: medición del período</p>')}${panel('Próximos pasos',`<div class="event"><div class="date">${date(x.date)}</div><p>${x.next}</p></div><div class="event"><div class="date">18 OCT</div><p>Revisión del informe</p></div><div class="actions">${button('＋ Crear tarea','new-task')}</div>`)}</div>`;
if(tab==='Compromisos')body=panel('Compromisos y mediciones',table(['Indicador','Meta','Medición','Estado'],[`<tr><td>Inversión</td><td>${money(x.investment)}</td><td>${money(x.executed)}</td><td>${badge('En ejecución')}</td></tr>`,`<tr><td>Empleo</td><td>${x.target} unidades</td><td>${x.jobs} unidades</td><td>${badge(x.jobs<x.target?'En riesgo':'Al día')}</td></tr>`,`<tr><td>Capacitación</td><td>40 horas</td><td>Sin medición</td><td>${badge('Pendiente')}</td></tr>`])+`<div class="actions">${button('＋ Registrar medición','measurement',true)}</div>`);
if(tab==='Tareas')body=taskPanel(state.tasks.filter(t=>t.project===pid));if(tab==='Solicitudes')body=requestList(state.requests.filter(r=>r.project===pid));if(tab==='Documentos')body=documents();if(tab==='Bitácora')body=panel('Historia del expediente',(pid===1?state.events:['Sin interacciones registradas para este expediente.']).map(s=>`<div class="event">${esc(s)}</div>`).join('')+`<div class="actions">${button('Registrar interacción','new-note')}</div>`);
return heading(esc(x.name),`${esc(x.company)} · Exp. ${x.exp} · Responsable: ${x.owner}`,button('＋ Crear solicitud','new-request',true))+`<div class="alert ${x.health==='Al día'?'good':''}"><span>${badge(x.health)} <b style="margin-left:10px">${x.health==='En riesgo'?'Empleo por debajo de la meta. Solicitar medición y plan de mejora.':x.health==='Dato viejo'?'La información necesita actualización.':'Proyecto al día. Continuar el seguimiento del período.'}</b></span><span class="small">Estado operativo: ${x.stage}</span></div><div class="tabs">${['Resumen','Compromisos','Tareas','Documentos','Solicitudes','Bitácora'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}</div>${body}`},
tasks(){return heading(role==='assistant'?'Mis tareas':'Trabajo del equipo','Cada pendiente tiene responsable, plazo y próxima acción.',button('＋ Nueva tarea','new-task',true))+`<div class="filters"><select id="task-filter" aria-label="Filtrar tareas"><option value="">Todos los estados</option>${['Pendiente','En curso','Bloqueada','Completada'].map(s=>`<option ${taskFilter===s?'selected':''}>${s}</option>`).join('')}</select></div>`+taskPanel(state.tasks.filter(t=>!taskFilter||t.status===taskFilter))},
calendar(){return heading('Vencimientos','Obligaciones y fechas relevantes · Octubre 2026')+`<div class="grid split">${panel('Octubre 2026',`<div class="calendar">${['L','M','M','J','V','S','D'].map(x=>`<span class="small">${x}</span>`).join('')}${'<span class="blank"></span>'.repeat(3)}${Array.from({length:31},(_,i)=>`<button class="${[5,8,12,18,25].includes(i+1)?'marked':''}" data-action="day:${i+1}">${i+1}</button>`).join('')}</div>`)}${panel('Próximos vencimientos',state.projects.map(x=>`<div class="event"><div class="date">${date(x.date)}</div><p>${x.company} · ${x.next}</p>${button('Ver proyecto','project:'+x.id)}</div>`).join(''))}</div>`},
requests(){return heading(role==='assistant'?'Pedidos de información':'Control de solicitudes','Sólo los ítems faltantes generan reiteraciones.',button('＋ Crear solicitud','new-request',true))+requestList(state.requests)},
reviews(){return heading('Revisiones y aprobaciones','Ningún informe se publica sin una aprobación registrada.')+`<div class="grid split">${panel('Informe de seguimiento',reportPreview())}${panel('Control de publicación',`<div class="event">Autor: Lucía Pérez</div><div class="event">Revisora: Ana López</div><div class="event">Estado: ${badge(state.reportStatus)}</div><p class="sub">Las modificaciones posteriores exigen nueva revisión.</p><div class="actions">${state.reportStatus==='En revisión'?button('Aprobar informe','approve',true)+button('Devolver con motivo','return-report'):state.reportStatus==='Aprobado'?button('Publicar en el portal','publish',true):state.reportStatus==='Borrador'?button('Enviar a revisión','review-report',true):badge('Publicado')}</div>`)}</div>`},

billing(){return heading('Facturación y cobranza','Datos económicos de demostración · Administración.')+`<div class="grid three">${kpi('Emitido',money(state.invoices.reduce((s,x)=>s+x.amount,0)),'3 facturas de demostración')}${kpi('Pendiente',money(state.invoices.filter(x=>x.status!=='Pagada').reduce((s,x)=>s+x.amount,0)),'Saldo de cobranza')}${kpi('Vencido',money(state.invoices.filter(x=>x.status==='Vencida').reduce((s,x)=>s+x.amount,0)),'Requiere seguimiento')}</div><div style="margin-top:20px">${panel('Facturas',table(['Sociedad','Factura','Importe','Vence','Estado',''],state.invoices.map(x=>`<tr><td>${x.company}</td><td>F-2026-${x.id}</td><td>${money(x.amount)}</td><td>${date(x.date)}</td><td>${badge(x.status)}</td><td>${x.status!=='Pagada'?button('Registrar pago','pay:'+x.id):'Cobrado'}</td></tr>`)))}</div>`},
commercial(){return heading('Oportunidades comerciales','Propuesta de CRM interno. Alternativa a la integración con HubSpot.',button('Nueva oportunidad','new-opportunity',true))+`<div class="grid three">${['Contacto inicial','Propuesta','Negociación'].map((s,i)=>`<section class="kanban"><h2>${s}</h2><div class="deal"><h3>${['Costa / Expansión','Norte / Equipos','Pradera / Nueva planta'][i]}</h3><p class="sub">${money([500000,750000,1500000][i])} previstos</p><p class="small" style="margin-top:14px">Próximo contacto: 09 oct</p>${i===2?`<div class="actions">${state.opportunityWon?badge('Ganada'):button('Marcar ganada','won',true)}</div>`:''}</div></section>`).join('')}</div><div style="margin-top:22px">${panel('Propuesta del asesor',`<p>Comparar renovación de equipos y ampliación de capacidad, documentando supuestos e impacto esperado.</p><p class="sub">La recomendación requiere revisión humana. Un simulador normativo necesita metodología acordada con SS Proyectos.</p><div class="actions">${button('Ver propuesta ilustrativa','proposal')}</div>`)}</div>`},
admin(){return heading('Administración','Usuarios, roles y configuración funcional.',button('Invitar usuario','invite',true))+panel('Usuarios del equipo y clientes',table(['Usuario','Rol','Estado','Acción'],state.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${badge(u.status)}</td><td>${i===0?'Sesión actual':button(u.status==='Desactivado'?'Activar':'Desactivar','user:'+i)}</td></tr>`)))+`<div class="grid half" style="margin-top:20px">${panel('Reglas y horizontes',`<p>Anticipación: 2 semanas / 4 semanas / 2 meses.</p><p class="sub">Las reglas de salud son versionadas y requieren validación antes de usarse con datos reales.</p>${button('Ver matriz de permisos','permissions')}`)}${panel('Restablecer datos de demo',`<p>Reiniciar el recorrido elimina los cambios locales de este prototipo.</p><div class="actions">${button('Restablecer demo','reset')}</div>`)}</div>`},
portal(){const x=state.projects[0],n=state.requests.filter(r=>r.project===1).reduce((s,r)=>s+r.items.filter(i=>i.status!=='Validado').length,0);return heading('Hola, '+esc(state.profile.name.split(' ')[0]),'Tus proyectos y próximos pasos, en un solo lugar.')+`<div class="alert good"><b>${n?`Tenés ${n} ítems pendientes de entrega o validación.`:'Tu información está al día.'}</b>${button('Ver solicitudes','client-requests')}</div><div class="grid split">${panel('Ampliación de planta',badge('Seguimiento')+`<div style="margin:24px 0">${kpi('Inversión prevista',money(x.investment),'Hasta diciembre 2027')}</div>`+metric('Inversión ejecutada',Math.round(x.executed/x.investment*100))+`<div class="actions">${button('Ver mi proyecto →','client-project',true)}</div>`)}${panel('Próximas fechas',`<div class="event"><div class="date">12 OCT</div><p>Entregar información de empleo</p></div><div class="event"><div class="date">18 OCT</div><p>Actualización del informe</p></div><div class="event"><p>Tu referente: Ana López</p><div class="actions">${button('Consultar al equipo','contact')}</div></div>`)}</div>`},
'client-project'(){const x=state.projects[0];return heading('Ampliación de planta','Río Sur S.A. · Proyecto en seguimiento')+`<div class="grid three">${kpi('Inversión prevista',money(x.investment),'Hasta diciembre 2027')}${kpi('Ejecutado a septiembre',money(x.executed),'Última actualización: 03 oct')}${kpi('Empleo informado',x.jobs+' / '+x.target,'Actualización solicitada')}</div><div class="grid split" style="margin-top:20px">${panel('Avance y próximos pasos',metric('Inversión',Math.round(x.executed/x.investment*100))+metric('Empleo',Math.round(x.jobs/x.target*100))+'<p>Próximo paso: entregar y validar la información solicitada.</p>'+`<div class="actions">${button('Ver mis solicitudes','client-requests',true)}</div>`)}${panel('Documentos compartidos',`<div class="event"><h3>Informe de agosto</h3><p class="small">Aprobado y publicado · 02 sep</p>${button('Ver informe','old-report')}</div>${state.published?`<div class="event"><h3>Informe de septiembre</h3>${button('Ver informe','published-report')}</div>`:''}<div class="event"><h3>Resolución del proyecto</h3>${button('Consultar documento','resolution')}</div>`)}</div>`},

'client-reports'(){return heading('Mis informes','Sólo se muestran informes aprobados y publicados.')+panel('Informes disponibles',table(['Informe','Publicado','Acción'],[...(state.published?[`<tr><td>Septiembre 2026</td><td>05 oct 2026</td><td>${button('Ver informe','published-report')}</td></tr>`]:[]),`<tr><td>Agosto 2026</td><td>02 sep 2026</td><td>${button('Ver informe','old-report')}</td></tr>`]))},
account(){return heading('Mi cuenta','Datos de contacto y preferencias de avisos.')+panel('Perfil',`<form id="account-form"><div class="fields">${field('Nombre','name',state.profile.name,'text',true)}${field('Correo','email',state.profile.email,'email',true)}</div><label class="check"><input type="checkbox" checked> Avisos de solicitudes y vencimientos por email</label><p class="small">Preferencias simuladas. El prototipo no envía mensajes.</p><div class="actions"><button class="primary" type="submit">Guardar cambios</button></div></form>`)},
guide(){return heading('Guía de la demo','Pantallas y funcionalidades del prototipo local.')+`<div class="tour"><div><h2>Probá el recorrido completo</h2><p>Proyecto → solicitud → vista cliente → entrega → validación → revisión → publicación.</p></div>${button('Comenzar recorrido','tour',true)}</div><div class="grid half">${panel('Qué podés probar','<p>Navegación, filtros, alta de proyectos, tareas, mediciones, solicitudes, recordatorios internos, archivos simulados, informes, pagos y usuarios.</p><p class="sub">Los archivos sólo conservan su nombre. No se suben ni se guardan sus bytes.</p>')}${panel('Cómo usarla','<p>Usá el selector superior para alternar Asistente, Manager y Socio. El menú, el inicio, el alcance de la cartera y las acciones cambian con el rol. Usá el otro botón para ver el portal cliente. La vista cliente muestra solamente Río Sur.</p><p class="sub">Restablecer demo permite repetir la presentación. Los datos se conservan localmente cuando el navegador lo admite.</p>')}</div><div class="grid three" style="margin-top:20px">${[['#001C54','Azul principal'],['#285B47','Verde principal'],['#F2FCF2','Verde claro']].map(([c,n])=>panel(n,`<div class="swatch" style="background:${c}"></div><code>${c}</code>`)).join('')}</div><div style="margin-top:20px">${panel('Etapa posterior','<p>Propuesta: TypeScript + Next.js. PostgreSQL en Neon para persistencia y Vercel para despliegue. Identidad visual: colores, Neue Montreal y Roboto Serif del sitio SS Proyectos. Esta demo es un archivo HTML autónomo y no necesita instalaciones, base de datos ni conexión a internet.</p><p class="sub">Autenticación, permisos del servidor, SharePoint, correo y cálculos fiscales requieren implementación y validación posteriores.</p>')}</div>`}
};
function taskPanel(list){return panel('Tareas',table(['Tarea','Proyecto','Responsable','Fecha','Estado','Acción'],list.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(state.projects.find(x=>x.id===t.project)?.company||'Proyecto')}</td><td>${esc(t.owner)}</td><td>${date(t.date)}</td><td>${badge(t.status)}</td><td>${t.status!=='Completada'?button('Completar','complete:'+t.id)+button('Bloquear','block:'+t.id):'✓ Completada'}</td></tr>`)))}
function documents(){return panel('Documentos y evidencias',table(['Documento','Versión','Estado','Acción'],[`<tr><td>Resolución del proyecto</td><td>v2 · 02 sep</td><td>${badge('Vigente')}</td><td>${button('Abrir','resolution')}</td></tr>`,...(pid===1?state.requests.filter(r=>r.project===1).flatMap(r=>r.items.filter(i=>i.file).map(i=>`<tr><td>${esc(i.file)}</td><td>v1 · demo</td><td>${badge(i.status)}</td><td>${button('Ver referencia','document-info')}</td></tr>`)):[])])+`<p class="sub">Base prevista: referencias a SharePoint. En esta demo no se conectan documentos reales.</p>`)}
function requestList(list,client=false){return panel(client?'Pedidos para Río Sur':'Pedidos registrados',table(['Solicitud','Proyecto','Vence','Avance','Estado','Acción'],list.map(r=>`<tr><td>SOL-${r.id}</td><td>${esc(state.projects.find(p=>p.id===r.project)?.company)}</td><td>${date(r.date)}</td><td>${r.items.filter(x=>x.status==='Validado').length} / ${r.items.length} validados</td><td>${badge(requestStatus(r))}</td><td>${button(client?'Entregar información':'Abrir pedido','request:'+r.id)}</td></tr>`)))}
function modal(title,body,footer=''){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="heading"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Cerrar">×</button></div>${body}${footer?`<footer>${footer}</footer>`:''}</section></div>`;document.querySelector('.modal input,.modal select,.modal button')?.focus()}
function close(){document.getElementById('overlay').innerHTML=''}
function requestModal(){const r=req();if(!allowedProject(r.project))return;modal(`Solicitud SOL-${r.id}`,`<p class="sub">${esc(state.projects.find(x=>x.id===r.project).company)} · Vence ${date(r.date)}</p>${table(['Ítem','Estado','Acción'],r.items.map((i,n)=>`<tr><td>${esc(i.name)}<div class="small">${esc(i.file||'Sin archivo')}</div>${i.reason?'<div class="small danger">Motivo: '+esc(i.reason)+'</div>':''}</td><td>${badge(i.status)}</td><td>${mode==='client'?(i.status==='Pendiente'||i.status==='Rechazado'?button('Adjuntar','upload:'+n):'<span class="small">'+(i.status==='Validado'?'Validado':'En revisión')+'</span>'):(i.status==='Recibido'?button('Validar','validate:'+n)+button('Rechazar','reject:'+n):'')}</td></tr>`))}${mode==='team'?`<div class="event">Contacto: ${esc(r.contact)} · ${esc(r.email)}</div><div class="event">Recordatorio interno: ${r.reminder?date(r.reminder):'Sin programar'}</div><div class="actions">${button('Programar recordatorio','reminder')}${button('Revisar borrador externo','email-draft')}</div>`:'<p class="sub">Recibido no significa validado. Los ítems rechazados pueden volver a enviarse.</p>'}`)}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="login-brand"><div class="brand">SS<small>PROYECTOS</small></div><h1>Tu cartera,<br>en un solo lugar.</h1><p>Seguimiento de inversiones, compromisos y próximos pasos.</p></div><div class="login-form"><section class="panel"><div class="eyebrow">Acceso de demostración</div><h1>Bienvenido</h1><p class="sub" style="margin-bottom:25px">Elegí la experiencia que querés explorar.</p>${field('Correo de ejemplo','login-email','ana@example.com','email')}<div class="stack"><p class="small">Entrar al equipo como:</p><div class="stack">${button('Asistente','enter-role:assistant')}${button('Manager','enter-role:manager',true)}${button('Socio','enter-role:partner')}</div>${button('Entrar como cliente','login-client')}${button('Recuperación de acceso','recover')}</div><p class="small" style="margin-top:20px">Sin contraseña ni autenticación real. Todos los datos son ficticios.</p></section></div></div>`}
function newProject(){modal('Nuevo proyecto',`<div class="stepper"><span class="${step===1?'active':''}">1 Datos</span><span class="${step===2?'active':''}">2 Compromisos</span><span class="${step===3?'active':''}">3 Revisión</span></div><form id="project-form">${step===1?`<div class="fields">${field('Sociedad *','company',draft.company||'','text',true)}${field('Nombre del proyecto *','name',draft.name||'','text',true)}${field('Inversión prevista USD *','investment',draft.investment||'','number',true)}${field('Responsable *','owner',draft.owner||'Ana López','text',true)}</div>`:step===2?`<div class="fields">${field('Meta de empleo *','target',draft.target||'20','number',true)}${field('Fin del compromiso *','enddate','2027-12-31','date',true)}</div><p class="small">Otros indicadores se definirán en la ficha. Borrador sin expediente oficial hasta su presentación.</p>`:`<div class="event"><b>${esc(draft.company)}</b><p>${esc(draft.name)}</p></div><div class="event">${money(draft.investment)} · Meta empleo: ${draft.target}</div><p class="sub">Se creará en preparación, sin mediciones ni beneficios calculados.</p>`}<footer>${step>1?button('Anterior','project-back'):button('Cancelar','close')}<button type="submit" class="primary">${step<3?'Continuar':'Crear proyecto'}</button></footer></form>`)}


views.documents=function(){return heading('Documentos y evidencias','Respaldo de tus expedientes asignados. Recibí, organizá y prepará la información para revisión.')+panel('Documentación asignada',table(['Expediente','Documento / ítem','Estado','Acción'],state.requests.flatMap(r=>r.items.map(i=>`<tr><td>${esc(state.projects.find(p=>p.id===r.project)?.company)}</td><td>${esc(i.file||i.name)}</td><td>${badge(i.status)}</td><td>${button('Abrir pedido','request:'+r.id)}</td></tr>`))))};
views['team-load']=function(){return heading('Carga del equipo','Compará pendientes, bloqueos y responsables antes de redistribuir el trabajo.')+panel('Capacidad operativa',table(['Persona','Pendientes','Bloqueadas','Rol'],['Ana López','Lucía Pérez','Diego Silva'].map(name=>`<tr><td>${name}</td><td>${state.tasks.filter(t=>t.owner===name&&t.status!=='Completada').length}</td><td>${state.tasks.filter(t=>t.owner===name&&t.status==='Bloqueada').length}</td><td>${name==='Lucía Pérez'?'Asistente':name==='Ana López'?'Manager':'Socio'}</td></tr>`)))+`<div style="margin-top:20px">${taskPanel(state.tasks)}</div>`};
views.analytics=function(){const total=state.projects.reduce((s,p)=>s+p.investment,0),executed=state.projects.reduce((s,p)=>s+p.executed,0);return heading('Indicadores de cartera','Visión consolidada para el socio. Importes y métricas de demostración.')+`<div class="grid kpis">${kpi('Inversión comprometida',money(total),'Cartera completa')}${kpi('Inversión ejecutada',money(executed),'Mediciones del período')}${kpi('Ejecución global',Math.round(executed/total*100)+'%','Ponderada por inversión')}${kpi('Expedientes en riesgo',state.projects.filter(p=>p.health==='En riesgo').length,'Requieren seguimiento')}</div>`+panel('Distribución por salud', ['Al día','En riesgo','Dato viejo'].map(status=>metric(status,Math.round(state.projects.filter(p=>p.health===status).length/state.projects.length*100))).join(''))+`<div style="margin-top:20px">${panel('Exposición por sociedad',table(['Sociedad','Comprometido','Ejecutado','Salud'],state.projects.map(p=>`<tr><td>${p.company}</td><td>${money(p.investment)}</td><td>${money(p.executed)}</td><td>${badge(p.health)}</td></tr>`)))}</div>`};
views.decisions=function(){return heading('Decisiones escaladas','Resolver las decisiones de alto nivel y conservar su fundamento.')+panel('Pendientes del socio',state.escalated?`<div class="alert"><div><b>Río Sur · Revisión de informe</b><p>Escalado por Ana López. Requiere decisión del socio.</p></div>${button('Resolver con fundamento','decision-reason',true)}</div>`:'<div class="empty"><h2>No hay decisiones escaladas</h2><p>La manager puede escalar un caso desde Revisiones y validaciones.</p></div>')+`<div style="margin-top:20px">${panel('Historial de decisiones',state.events.filter(s=>/escal|resolv|decisión/i.test(s)).map(s=>`<div class="event">${esc(s)}</div>`).join('')||'<p class="sub">Todavía no se registraron decisiones escaladas.</p>')}</div>`};
const baseHome=views.home;
views.home=function(){if(role==='manager')return baseHome().replace('Tu cartera y las acciones que necesitan atención.','Centro de excepciones: priorizar, validar y coordinar.');if(role==='assistant')return heading('Tu cola del día, Lucía','Empezá por los pendientes de tus expedientes asignados.',button('Crear tarea','new-task',true))+`<div class="grid kpis">${kpi('Mis expedientes',state.projects.length,'Alcance asignado')}${kpi('Mis tareas',state.tasks.filter(t=>t.status!=='Completada').length,'Cargar, resolver o bloquear')}${kpi('Pedidos abiertos',state.requests.filter(r=>requestStatus(r)!=='Completa').length,'Preparar información')}${kpi('Mediciones pendientes',(state.pendingMeasurements||[]).length,'Requieren validación')}</div><div class="alert good">Podés preparar información y solicitar revisión. La aprobación queda a cargo de Manager o Socio.</div>`+taskPanel(state.tasks)+`<div style="margin-top:20px">${panel('Expedientes asignados',table(['Proyecto','Expediente','Responsable','Salud','Próximo paso',''],projectRows(state.projects)))}</div>`;return heading('Panorama de la cartera, Diego','Riesgos, decisiones escaladas y situación económica.')+`<div class="grid kpis">${kpi('Cartera total',state.projects.length,'Todos los expedientes')}${kpi('Inversión comprometida',money(state.projects.reduce((s,p)=>s+p.investment,0)),'Valores ficticios')}${kpi('En riesgo',state.projects.filter(p=>p.health==='En riesgo').length,'Decisiones y seguimiento')}${kpi('Casos escalados',state.escalated?1:0,'Pendientes de decisión')}</div><div class="grid split">${panel('Salud de la cartera',table(['Proyecto','Expediente','Responsable','Salud','Próximo paso',''],projectRows(state.projects)))}${panel('Decisiones del socio',state.escalated?'<p>Informe de Río Sur escalado por la manager.</p><div class="actions">'+button('Resolver con fundamento','decision-reason',true)+'</div>':'<p>No hay casos escalados pendientes.</p><p class="sub">Las excepciones de alto riesgo se revisan aquí.</p>')}</div>`};
const baseReviews=views.reviews;
views.reviews=function(){return (state.escalated?'<div class="alert">Caso escalado a Socio. Manager puede consultar; la resolución corresponde al socio.</div>':'')+baseReviews()+`<div class="actions">${role==='manager'?button('Escalar decisión al socio','escalate'):role==='partner'&&state.escalated?button('Resolver con fundamento','decision-reason',true):''}</div>`+panel('Mediciones pendientes de validación',table(['Proyecto','Indicador','Valor / período','Fuente','Acción'],(state.pendingMeasurements||[]).filter(m=>allowedProject(m.project)).map(m=>`<tr><td>${esc(state.projects.find(p=>p.id===m.project)?.company)}</td><td>${m.indicator==='jobs'?'Empleo':'Inversión'}</td><td>${esc(m.value)} · ${esc(m.period)}</td><td>${esc(m.source)}</td><td>${button('Validar medición','validate-measurement:'+m.id)}</td></tr>`)))};
const actions={'decision-reason'(){modal('Resolver decisión escalada',`<form id="decision-form"><label>Decisión y fundamento *</label><textarea name="reason" required></textarea><footer><button class="primary">Registrar decisión</button></footer></form>`)},'preview-draft'(){modal('Borrador de informe · Sin aprobación',reportPreview()+'<p class="sub">Preparación del equipo. La validación y publicación corresponden a Manager o Socio.</p>')},switch(){mode=mode==='team'?'client':'team';go(mode==='client'?'portal':'home')},menu(){document.getElementById('sidebar').classList.toggle('open')},close,'open-main'(){mode='team';go('project',1)},home(){go('home')},portfolio(){go('portfolio')},tasks(){go('tasks')},reviews(){go('reviews')},'client-requests'(){go('client-requests')},'client-project'(){go('client-project')},clear(){filter=healthFilter=ownerFilter='';render()},'login-team'(){mode='team';go('home')},'login-client'(){mode='client';go('portal')},recover(){modal('Recuperar acceso',`<p>Esta pantalla demuestra el flujo de recuperación.</p><form id="recover-form" style="margin-top:20px">${field('Correo','email','','email',true)}<footer><button class="primary">Solicitar enlace simulado</button></footer></form>`)},'new-project'(){step=1;draft={};newProject()},'project-back'(){step--;newProject()},'new-task'(){modal('Nueva tarea',`<form id="task-form"><div class="fields">${field('Título *','title','','text',true)}${field('Fecha *','date','2026-10-12','date',true)}${field('Responsable *','owner',roles[role].name,'text',true)}<div><label>Proyecto</label><select name="project">${visibleProjects().map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${esc(x.company)} / ${esc(x.name)}</option>`).join('')}</select></div></div><footer><button class="primary">Crear tarea</button></footer></form>`)},'new-request'(){modal('Crear solicitud',`<form id="request-form"><div class="fields"><div><label>Proyecto</label><select name="project">${visibleProjects().map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${esc(x.company)}</option>`).join('')}</select></div>${field('Contacto *','contact','Martín López','text',true)}${field('Correo *','email','martin@example.com','email',true)}${field('Fecha de entrega *','date','2026-10-12','date',true)}</div><label>Ítems solicitados (uno por línea) *</label><textarea name="items" required>Medición de empleo actualizada\nPlan de mejora</textarea><footer><button class="primary">Guardar solicitud</button></footer></form>`)},measurement(){modal('Registrar medición',`<form id="measurement-form"><div class="fields"><div><label>Indicador</label><select name="indicator"><option value="jobs">Empleo</option><option value="executed">Inversión ejecutada USD</option></select></div>${field('Valor *','value','','number',true)}${field('Período *','period','Sep 2026','text',true)}${field('Fuente / evidencia *','source','','text',true)}</div><p class="small">${role==='assistant'?'La medición se envía a revisión y no modifica el indicador hasta su validación.':'Guardado y validación simulados. Reglas reales pendientes.'}</p><footer><button class="primary">${role==='assistant'?'Enviar medición a revisión':'Guardar medición validada'}</button></footer></form>`)},'new-note'(){modal('Registrar interacción',`<form id="note-form"><label>Nota *</label><textarea name="note" required></textarea><footer><button class="primary">Guardar nota</button></footer></form>`)},reminder(){modal('Recordatorio interno',`<form id="reminder-form">${field('Avisar a Ana López el','date',req().reminder||'2026-10-09','date',true)}<p class="sub">El aviso queda registrado de forma simulada. No se programa un envío real.</p><footer><button class="primary">Guardar recordatorio</button></footer></form>`)},'email-draft'(){const r=req(),missing=r.items.filter(x=>x.status!=='Validado');modal('Borrador externo · Envío simulado',`<form id="draft-form">${field('Para','to',r.email,'email',true)}${field('Asunto','subject','Información pendiente · SOL-'+r.id,'text',true)}<label style="margin-top:15px">Mensaje</label><textarea name="message" rows="6">${esc('Hola '+r.contact+',\n\nNecesitamos completar estos ítems: '+missing.map(x=>x.name).join(', ')+'.\nFecha de entrega: '+date(r.date)+'.\n\nGracias, equipo SS Proyectos.')}</textarea><p class="small">Opción B17. No se enviará ningún correo real.</p><footer><button class="primary" ${missing.length?'':'disabled'}>Registrar envío simulado</button></footer></form>`)},approve(){state.reportStatus='Aprobado';log('Ana López aprobó el informe de septiembre.');render();notify('Informe aprobado. Ya podés publicarlo en el portal.')},publish(){if(state.reportStatus!=='Aprobado')return;state.reportStatus='Publicado';state.published=true;log('Informe publicado en el portal del cliente.');render();notify('Informe visible en Mis informes del cliente.')},'return-report'(){modal('Devolver informe',`<form id="return-form"><label>Motivo obligatorio</label><textarea name="reason" required></textarea><footer><button class="primary">Devolver con observaciones</button></footer></form>`)},'review-report'(){state.reportStatus='En revisión';save();render();notify('Informe enviado a revisión.')},'old-report'(){modal('Informe de agosto 2026',`<p class="small">Publicado el 02 sep 2026 · Versión aprobada</p><div class="report"><h2>Seguimiento de agosto</h2><p>Inversión ejecutada: USD 780.000. Empleo informado: 16 unidades. Se acordó actualizar el indicador en el próximo período.</p><p class="sub">Informe ficticio para demostrar una versión anterior.</p></div>`,button('Imprimir / guardar como PDF','print'))},'published-report'(){if(!state.published)return;modal('Informe publicado · Septiembre',reportPreview(),button('Imprimir / guardar como PDF','print'))},print(){window.print()},resolution(){modal('Resolución del proyecto',`<p>Referencia documental de demostración.</p><div class="event">Proyecto: ampliación de planta · Río Sur S.A.</div><div class="event">Versión vigente: v2 · 02 septiembre</div><p class="sub">En producción se abriría el documento autorizado en SharePoint. La demo no contiene una resolución real.</p>`)},'document-info'(){modal('Evidencia de demostración','<p>Se conserva el nombre del archivo y su estado. Los bytes no fueron subidos ni almacenados.</p>')},contact(){modal('Consultar al equipo',`<form id="contact-form"><label>Consulta</label><textarea name="message" required></textarea><footer><button class="primary">Registrar consulta simulada</button></footer></form>`)},invite(){modal('Invitar usuario',`<form id="invite-form"><div class="fields">${field('Nombre','name','','text',true)}${field('Correo','email','','email',true)}<div><label>Rol</label><select name="role"><option>Asistente</option><option>Manager</option><option>Socio</option><option>Administración</option><option>Cliente</option></select></div></div><p class="small">Invitación simulada, sin envío real. Un cliente se asociaría a sociedades explícitas.</p><footer><button class="primary">Registrar invitación</button></footer></form>`)},permissions(){modal('Permisos propuestos',table(['Rol','Alcance'],['Asistente|Expedientes asignados, cargar información y tareas','Manager|Supervisar, validar y aprobar según riesgo','Socio|Cartera completa y decisiones de alto riesgo','Administración|Datos económicos y accesos autorizados','Cliente|Sólo su sociedad y contenido publicado'].map(s=>`<tr>${s.split('|').map(t=>`<td>${t}</td>`).join('')}</tr>`))+'<p class="sub">La demo sólo separa vistas. La autorización real deberá verificarse en el servidor.</p>')},reset(){modal('Restablecer demo','<p>Se eliminarán los cambios guardados en este navegador y se recuperarán los datos iniciales.</p>',button('Cancelar','close')+button('Restablecer','confirm-reset',true))},'confirm-reset'(){state=structuredClone(initial);save();close();mode='team';go('home');notify('Datos de demostración restablecidos.')},won(){if(state.opportunityWon)return;state.opportunityWon=true;state.projects.push({id:Date.now(),company:'Pradera S.A.',name:'Nueva planta',exp:'Borrador',owner:'Ana López',health:'Dato viejo',stage:'En preparación',investment:1500000,executed:0,benefit:0,jobs:0,target:20,next:'Completar checklist inicial',date:'2026-10-20'});save();render();notify('Oportunidad ganada. Expediente creado en la cartera.')},proposal(){modal('Propuesta ilustrativa del asesor','<h3>Renovación de equipos</h3><p>Priorizar equipos que permitan sostener la capacidad actual y documentar su inversión.</p><h3 style="margin-top:22px">Ampliación de capacidad</h3><p>Evaluar demanda, inversión prevista y compromisos que la empresa puede mantener.</p><p class="sub">Ejemplo de contenido. No incluye ranking financiero ni beneficios fiscales calculados.</p>')},'new-opportunity'(){modal('Nueva oportunidad',`<p>La demo comercial incluye una oportunidad en negociación que podés marcar como ganada para crear su expediente.</p>`,button('Ver cartera','portfolio'))},tour(){mode='team';tour=true;go('project',1);notify('Paso 1: creá una solicitud. Luego usá “Ver como cliente” para entregar la información.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-route],[data-project],[data-tab]');if(!el)return;if(el.dataset.route){go(el.dataset.route);return}if(el.dataset.project){go('project',el.dataset.project);return}if(el.dataset.tab){tab=el.dataset.tab;render();return}const a=el.dataset.action;if(a.startsWith('enter-role:')){mode='team';switchRole(a.split(':')[1]);go('home');return}if(a.startsWith('role:')){switchRole(a.split(':')[1]);return}if(!permitted(a)){notify('Acción no habilitada para este rol.');return}if(a.startsWith('request:')&&!allowedProject(state.requests.find(r=>r.id===+a.split(':')[1])?.project)){notify('Solicitud fuera del alcance.');return}if(a==='approve'&&state.escalated&&role!=='partner'){notify('Este caso requiere resolución del socio.');return}if(actions[a]){actions[a]();return}const [type,id]=a.split(':');if(type==='validate-measurement'){const m=(state.pendingMeasurements||[]).find(m=>m.id===+id);if(!m||!allowedProject(m.project))return;const x=state.projects.find(x=>x.id===m.project);x[m.indicator]=+m.value;x.health=x.jobs<x.target?'En riesgo':'Al día';state.pendingMeasurements=state.pendingMeasurements.filter(v=>v.id!==m.id);log(roles[role].name+' validó la medición '+m.period);render();notify('Medición validada y aplicada al proyecto.');return}if(type==='reassign'){return}if(type==='escalate'){state.escalated=true;log('Ana López escaló el informe a Socio.');render();notify('Caso pendiente de decisión del socio.');return}if(type==='resolve-escalation'){state.escalated=false;log('Diego Silva resolvió el caso escalado: continuar revisión.');render();notify('Caso resuelto. El informe sigue su circuito de aprobación.');return}if(type==='project'){go('project',id)}if(type==='company'){if(!allowedProject(id))return;const x=state.projects.find(x=>x.id===+id);modal(x.company,`<div class="event">Sector: industria / servicios · Datos ficticios</div><div class="event">Contacto: ${x.id===1?'Martín López · martin@example.com':'Contacto de demostración'}</div><div class="event">Proyecto: ${esc(x.name)}</div>`,button('Abrir expediente','project:'+x.id,true))}if(type==='request'){rid=+id;requestModal()}if(type==='complete'){state.tasks.find(t=>t.id===+id).status='Completada';save();render();notify('Tarea completada.')}if(type==='block'){modal('Bloquear tarea',`<form id="block-form" data-id="${id}"><label>Motivo *</label><textarea name="reason" required></textarea><footer><button class="primary">Guardar bloqueo</button></footer></form>`)}if(type==='day'){const s='2026-10-'+id.padStart(2,'0');const list=state.projects.filter(x=>x.date===s);modal(id+' de octubre',list.length?list.map(x=>`<div class="event">${x.company}: ${x.next}</div>`).join(''):'<p>No hay vencimientos registrados para este día.</p>')}if(type==='upload'){const i=req().items[+id];modal('Entregar información',`<form id="upload-form" data-index="${id}"><p><b>${esc(i.name)}</b></p><div class="filebox" style="margin:20px 0"><label for="file">Seleccioná un archivo</label><input id="file" name="file" type="file" accept=".pdf,.xlsx,.jpg,.jpeg" required><p class="small">PDF / XLSX / JPG · Máximo 10 MB. Carga simulada.</p></div><label>Comentario opcional</label><textarea name="comment"></textarea><p id="file-error" class="danger" role="alert"></p><footer><button class="primary">Enviar información</button></footer></form>`)}if(type==='validate'){req().items[+id].status='Validado';log('Ítem validado: '+req().items[+id].name);requestModal();render();notify('Evidencia validada; solicitud '+requestStatus(req()).toLowerCase()+'.')}if(type==='reject'){modal('Rechazar evidencia',`<form id="reject-form" data-index="${id}"><label>Motivo obligatorio</label><textarea name="reason" required></textarea><footer><button class="primary">Rechazar con motivo</button></footer></form>`)}if(type==='pay'){state.invoices.find(x=>x.id===+id).status='Pagada';save();render();notify('Pago completo registrado de forma simulada.')}if(type==='user'){const u=state.users[+id];u.status=u.status==='Desactivado'?'Activo':'Desactivado';save();render();notify('Estado de acceso actualizado.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('tr[data-project]'))go('project',e.target.dataset.project);if(e.key==='Tab'&&document.querySelector('.modal')){const f=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){filter=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('filter');n.focus();n.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='health-filter'){healthFilter=e.target.value;render()}if(e.target.id==='owner-filter'){ownerFilter=e.target.value;render()}if(e.target.id==='task-filter'){taskFilter=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.target.id==='global-search'&&e.key==='Enter'){if(mode==='client'){go('client-project');return}filter=e.target.value;go('portfolio')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),v=Object.fromEntries(d);const gated={'project-form':'new-project','return-form':'return-report','invite-form':'invite','reject-form':'reject'};if(mode==='team'&&gated[f.id]&&!permitted(gated[f.id])){notify('Acción no habilitada para este rol.');return}if(['task-form','request-form'].includes(f.id)&&!allowedProject(v.project)){notify('Proyecto fuera del alcance del rol.');return}if(f.id==='decision-form'){if(role!=='partner')return;state.escalated=false;log('Diego Silva resolvió el caso escalado. Fundamento: '+v.reason);close();render();notify('Decisión registrada con fundamento.');return}if(f.id==='project-form'){if(step===1&&+v.investment<=0){notify('La inversión debe ser mayor que cero.');return}if(step===2&&+v.target<=0){notify('La meta debe ser mayor que cero.');return}draft={...draft,...v};if(step<3){step++;newProject();return}state.projects.push({id:Date.now(),createdByRole:role,company:draft.company,name:draft.name,exp:'Borrador',owner:draft.owner,health:'Dato viejo',stage:'En preparación',investment:+draft.investment,executed:0,benefit:0,jobs:0,target:+draft.target,next:'Completar documentación',date:draft.enddate});save();close();go('portfolio');notify('Proyecto creado en preparación.');return}if(f.id==='task-form'){state.tasks.push({id:Date.now(),...v,project:+v.project,status:'Pendiente'});save();close();render();notify('Tarea creada con responsable y plazo.');return}if(f.id==='request-form'){const items=v.items.split('\n').map(s=>s.trim()).filter(Boolean);if(!items.length){notify('Agregá al menos un ítem.');return}rid=Math.max(...state.requests.map(r=>r.id))+1;state.requests.push({id:rid,project:+v.project,contact:v.contact,email:v.email,date:v.date,reminder:'',items:items.map(name=>({name,status:'Pendiente',file:''}))});log('Solicitud SOL-'+rid+' creada.');close();go('requests');requestModal();notify('Solicitud registrada. Cambiá a la vista cliente para entregar.');return}if(f.id==='measurement-form'){if(!Number.isFinite(+v.value)||+v.value<0){notify('Ingresá un valor no negativo.');return}if(role==='assistant'){state.pendingMeasurements??=[];state.pendingMeasurements.push({id:Date.now(),project:pid,...v});log('Lucía Pérez envió medición a revisión.');close();render();notify('Medición pendiente de validación por Manager o Socio.');return}p()[v.indicator]=+v.value;p().health=p().jobs<p().target?'En riesgo':'Al día';log('Medición validada: '+v.indicator+' = '+v.value+' · '+v.period+' · Fuente: '+v.source);close();render();notify('Medición actualizada.');return}if(f.id==='upload-form'){const file=d.get('file');if(!file||!file.size)return;const error=!/\.(pdf|xlsx|jpe?g)$/i.test(file.name)?'Formato no permitido. Usá PDF, XLSX o JPG.':file.size>10*1024*1024?'El archivo supera el máximo de 10 MB.':'';if(error){document.getElementById('file-error').textContent=error;return}const item=req().items[+f.dataset.index];item.file=file.name;item.status='Recibido';item.comment=v.comment;log('Archivo recibido (simulado): '+file.name);requestModal();render();notify('Información recibida. El equipo debe validarla.');return}if(f.id==='reject-form'){const item=req().items[+f.dataset.index];item.status='Rechazado';item.reason=v.reason;log('Evidencia rechazada: '+v.reason);requestModal();render();notify('Ítem rechazado; el cliente puede volver a adjuntar.');return}if(f.id==='reminder-form'){if(v.date>req().date){notify('El recordatorio debe ser anterior o igual al vencimiento.');return}req().reminder=v.date;save();requestModal();notify('Recordatorio interno registrado (simulado).');return}if(f.id==='draft-form'){log('Envío externo SIMULADO registrado para SOL-'+req().id);close();notify('Envío simulado registrado. No se envió ningún correo.');return}if(f.id==='return-form'){state.reportStatus='Borrador';log('Informe devuelto: '+v.reason);close();render();notify('Informe devuelto a borrador.');return}if(f.id==='block-form'){state.tasks.find(t=>t.id===+f.dataset.id).status='Bloqueada';state.tasks.find(t=>t.id===+f.dataset.id).reason=v.reason;save();close();render();notify('Tarea bloqueada con motivo.');return}if(f.id==='note-form'){log(v.note);close();render();notify('Interacción registrada.');return}if(f.id==='account-form'){state.profile=v;save();render();notify('Perfil actualizado en la demo.');return}if(f.id==='invite-form'){state.users.push({name:v.name,role:v.role,status:'Invitado'});save();close();render();notify('Invitación registrada (sin envío real).');return}if(f.id==='contact-form'){log('Consulta del cliente: '+v.message);close();notify('Consulta registrada de forma simulada.');return}if(f.id==='recover-form'){close();notify('Solicitud simulada registrada. No se envió un enlace real.')}});
