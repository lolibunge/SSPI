<title>SSPI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Roboto+Serif:ital,opsz,wght@0,8..144,400;0,8..144,600;1,8..144,400&display=swap">
<style>
/* Layout: navy sidebar (marca S|S) + work area with sticky top bar; dense tables, one accent, color only for state. */
:root{
  --navy:#001C54; --navy-2:#0B2A6B; --green:#285B47; --mint:#F2FCF2;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8F9FB; --line:#E3E7EE; --line-2:#EEF1F5;
  --ink:#0F1B33; --muted:#535861; --faint:#8A919D;
  --accent:#001C54; --accent-ink:#FFFFFF; --accent-soft:#E7ECF6;
  --good:#1F7A4D; --good-bg:#E6F4EC; --warn:#A86A00; --warn-bg:#FBF1DC; --crit:#BC3A26; --crit-bg:#FBE9E5;
  --stale:#6B5BA8; --stale-bg:#EFECF8; --info-bg:#EAF0FA;
  --side-bg:#001C54; --side-ink:#C9D3E8; --side-ink-strong:#FFFFFF; --side-hover:rgba(255,255,255,.07);
  --ai:#285B47; --ai-bg:#EAF5EE;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 4px 16px rgba(15,27,51,.06);
  --f-display:"Roboto Serif",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1020; --surface:#111A2E; --surface-2:#0E1628; --line:#223050; --line-2:#1A2640;
  --ink:#E7ECF5; --muted:#A3ADBF; --faint:#7581A0;
  --accent:#8FB0F0; --accent-ink:#06132E; --accent-soft:#1A2A4D;
  --good:#5CC48F; --good-bg:#12301F; --warn:#E3AC4A; --warn-bg:#33270F; --crit:#F08470; --crit-bg:#3A1B16;
  --stale:#B4A6EE; --stale-bg:#2A2448; --info-bg:#16233F;
  --side-bg:#060D1F; --side-ink:#A9B6D3; --side-ink-strong:#FFFFFF; --side-hover:rgba(255,255,255,.06);
  --ai:#7FD1A6; --ai-bg:#14301F; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1020; --surface:#111A2E; --surface-2:#0E1628; --line:#223050; --line-2:#1A2640;
  --ink:#E7ECF5; --muted:#A3ADBF; --faint:#7581A0;
  --accent:#8FB0F0; --accent-ink:#06132E; --accent-soft:#1A2A4D;
  --good:#5CC48F; --good-bg:#12301F; --warn:#E3AC4A; --warn-bg:#33270F; --crit:#F08470; --crit-bg:#3A1B16;
  --stale:#B4A6EE; --stale-bg:#2A2448; --info-bg:#16233F;
  --side-bg:#060D1F; --side-ink:#A9B6D3; --side-ink-strong:#FFFFFF; --side-hover:rgba(255,255,255,.06);
  --ai:#7FD1A6; --ai-bg:#14301F; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--side-bg);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.mono{font-family:var(--f-display);font-size:26px;color:#fff;letter-spacing:.02em;display:flex;align-items:center;gap:7px;line-height:1}
.mono i{display:block;width:1px;height:26px;background:rgba(255,255,255,.55)}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-ink)}
.brand b{display:block;color:#fff;font-weight:600;font-size:13px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp h6{margin:0 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,211,232,.55);font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border:0;background:none;color:var(--side-ink);text-align:left;width:100%}
.nav:hover{background:var(--side-hover);color:#fff}
.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:1px 7px}
.nav .cnt.hot{background:#BC3A26}
.nav .soon{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgba(201,211,232,.6);border:1px solid rgba(201,211,232,.25);border-radius:4px;padding:0 5px}
.side-foot{margin-top:auto;font-size:11.5px;color:rgba(201,211,232,.6);padding:0 10px;display:flex;flex-direction:column;gap:10px}
.rebl{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:inherit;font-size:11px;letter-spacing:.04em}
.rebl b{font-weight:800;letter-spacing:.14em;font-size:12px}
.rebl:hover b{text-decoration:underline}

.side .rebl .rebl-logo{color:#fff}
.rebl-foot .rebl-logo{color:var(--muted)}
.rebl:hover .rebl-logo{opacity:.8}
.side .rebl{color:rgba(201,211,232,.75);border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.side .rebl b{color:#fff}
.rebl-foot{display:flex;justify-content:center;padding:4px 0 8px;color:var(--faint)}
footer.rebl-foot,.rebl-foot.mob-only{display:none}
.rebl-foot b{color:var(--muted)}
/* Top */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.search input{border:0;outline:0;background:none;width:100%}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.role{margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.role button{border:0;background:none;border-radius:6px;padding:6px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.role button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av{overflow:hidden;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;display:grid;place-items:center}
.themebtn svg{width:16px;height:16px}
/* View */
.view{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:13.5px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h .hint{font-size:12.5px;color:var(--muted)}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.grid.g2,.grid.g-main{align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
/* Secciones sin caja */
.sec{min-width:0}
.sec>.card-h{padding:0 0 10px;border-bottom:1px solid var(--line)}
.sec>.card-b{padding:14px 0 0}
.sec>.list .li{padding-inline:0}
.sec>.timeline{padding-inline:0}
.sec .grp{padding-inline:0}
.kstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line)}
.kstats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kstats>.card{background:none;border:0;border-radius:0;border-left:1px solid var(--line);padding:12px 18px}
.kstats>.card:first-child{border-left:0;padding-left:0}
button.card.kpi{cursor:pointer}
button.card.kpi:hover .val{color:var(--accent)}
/* KPI */
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lab{font-size:12.5px;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-size:30px;line-height:1.1}
.kpi .delta{font-size:12px;color:var(--muted)}
.kpi .delta b{font-weight:600}
.up{color:var(--good)} .down{color:var(--crit)}
/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.good{color:var(--good)} .btn.crit{color:var(--crit)} .btn.warnb{color:var(--warn)}
.btn svg{width:14px;height:14px}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* Signals */
.sig{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}
.sig::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-verde{color:var(--good);background:var(--good-bg)}
.s-amarillo{color:var(--warn);background:var(--warn-bg)}
.s-rojo{color:var(--crit);background:var(--crit-bg)}
.fr{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap;color:var(--muted)}
.fr svg{width:14px;height:14px}
.fr.f-vieja{color:var(--stale);font-weight:600}
.fr.f-por{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.crit{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.good{color:var(--good);background:var(--good-bg);border-color:transparent}
.chip.stale{color:var(--stale);background:var(--stale-bg);border-color:transparent}
.chip.info{color:var(--accent);background:var(--info-bg);border-color:transparent}
.chip.ai{color:var(--ai);background:var(--ai-bg);border-color:transparent}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .xs{font-size:11.5px}
.b{font-weight:600}
.link{color:var(--accent);background:none;border:0;padding:0;font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th.num,td.num{text-align:center}
th.num-r,td.num-r{text-align:right;white-space:nowrap}
td.act-c{text-align:right;white-space:nowrap;width:1%}
table.fact td{padding-block:12px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
.exp-n{font-size:11.5px;color:var(--faint)}
.na{display:flex;flex-direction:column;gap:1px;min-width:190px}
.na .d{font-size:11.5px;color:var(--muted)}
.na .d.late{color:var(--crit);font-weight:600}
/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.li>div:not(.stripe):not(.btns):not(.acts):not(.more){flex:1;min-width:0}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.stripe{display:none}
/* Acciones compactas */
.acts{display:flex;gap:2px;align-items:center;flex:none}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.ib:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.ib svg{width:17px;height:17px}
.ib.good:hover{color:var(--good);background:var(--good-bg);border-color:transparent}
.ib.crit:hover{color:var(--crit);background:var(--crit-bg);border-color:transparent}
.ib.solid{border-color:var(--line);background:var(--surface)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);right:0;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:25}
.av[data-tip]{position:relative;cursor:default}
.tip-b[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px);left:50%;right:auto;transform:translateX(-50%)}
.fr.tip-b{position:relative}
table.exp .c-resp .nm{display:none}
table.exp th,table.exp td{padding-inline:10px}
table.exp .c-resp,table.exp .c-min{width:1%;white-space:nowrap}
.sol-list{display:flex;flex-direction:column}
.sol{padding:14px 16px;border-bottom:1px solid var(--line)}
.sol:last-child{border-bottom:0}
.sol-h{display:grid;grid-template-columns:minmax(0,1fr) auto 96px 34px 34px;gap:4px;align-items:center}
.sol-h .sol-st{margin-right:20px}
.sol-t .t{font-weight:600}
.sol-t .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sol-st{display:flex;align-items:center;gap:10px}
.prog{width:72px;height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;display:block}
.prog i{display:block;height:100%;background:var(--good);border-radius:4px}
.stt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stt.crit{color:var(--crit)} .stt.warn{color:var(--warn)} .stt.good{color:var(--good)} .stt.info{color:var(--accent)}
.dot.info{background:var(--accent)}
.sol-items{margin-top:8px;margin-left:14px;border-left:2px solid var(--line-2);padding-left:14px}
.sol-i{display:grid;grid-template-columns:minmax(0,1fr) 96px 34px 34px;gap:4px;align-items:center;min-height:38px;padding:2px 0}
.sol-i .nm{font-size:13.5px}
.slot{display:flex;justify-content:center}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;padding:0;position:relative}
.check svg{width:13px;height:13px}
.check:hover{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.check[data-tip]:hover::after{left:0;right:auto}
.more{position:relative;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column}
.mi{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;gap:8px;align-items:center}
.mi:hover{background:var(--surface-2)}
.mi svg{width:15px;height:15px;color:var(--muted)}
.mi.crit{color:var(--crit)}
.grp{display:flex;align-items:baseline;gap:8px;padding:14px 16px 4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.grp b{font-weight:600;color:var(--faint)}
.grp.late{color:var(--crit)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint);flex:none}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.stale{background:var(--stale)} .dot.good{background:var(--good)}
.li .m .sep{color:var(--line)}
.blk{color:var(--stale);font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* Ficha */
.ficha-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.signals3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-block:1px solid var(--line)}
.signals3>div{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.signals3>div:first-child{border-left:0;padding-left:0}
.signals3 .lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.signals3 .big{font-size:15px;font-weight:600}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.meta b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.comp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;padding:16px;border-bottom:1px solid var(--line-2)}
.comp:last-child{border-bottom:0}
.comp .num{font-family:var(--f-display);font-size:26px}
.bar{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}
.note{border-left:3px solid var(--stale);background:var(--stale-bg);padding:8px 10px;border-radius:0 6px 6px 0;font-size:12.5px}
.drag{display:flex;gap:8px;align-items:center;background:var(--crit-bg);color:var(--crit);padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500}
.timeline{display:flex;flex-direction:column;gap:0;padding:6px 16px 12px}
.tl{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:10px;padding:8px 0}
.tl .dt{font-size:12px;color:var(--muted);text-align:right;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);margin:4px auto 0}
.tl .dot.sys{border-color:var(--faint)} .tl .dot.dec{border-color:var(--green);background:var(--green)} .tl .dot.exc{border-color:var(--stale)}
/* Kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;flex-direction:column;gap:2px;padding:4px 4px 8px;min-height:52px;border-bottom:1px solid var(--line);margin-bottom:2px}
.col-h b{font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.col-h b em{font-style:normal;font-weight:600;color:var(--muted);font-size:12px}
.col-h span{font-size:12px;color:var(--muted)}
.kc-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.kc .amt{font-family:var(--f-display);font-size:18px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.cal .dh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.cal .dc{min-height:92px;padding:6px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:var(--surface-2);opacity:.55}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:12px;color:var(--muted);font-weight:600}
.ev{font-size:11px;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;background:var(--info-bg);color:var(--ink)}
.ev.crit{background:var(--crit-bg);color:var(--crit)} .ev.warn{background:var(--warn-bg)} .ev.good{background:var(--good-bg)}
/* Report */
.rep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.ai-p{background:var(--ai-bg);border-left:3px solid var(--ai);padding:8px 10px;border-radius:0 6px 6px 0;position:relative}
.ai-p[contenteditable="true"]{outline:1px dashed var(--ai)}
.ai-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ai);font-weight:700;display:flex;gap:6px;align-items:center;margin-bottom:3px}
.rule{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:baseline}
.rule>.rk{font-size:13px;font-weight:600}
.rule.rc{grid-template-columns:72px minmax(0,1fr)}
.rule>.rk.code{font-size:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--accent)}
.rule:last-child{border-bottom:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.step.done{color:var(--good);border-color:transparent;background:var(--good-bg)}
.step.cur{color:var(--accent);border-color:var(--accent);font-weight:600}
/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(6,13,31,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .card-b{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 10px}
.fld textarea{min-height:76px;resize:vertical}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:max-content;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);z-index:60;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lbl{fill:var(--ink);font-weight:600}
.callout{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.callout svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.lock{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lock svg{width:13px;height:13px}
.soonp{display:grid;place-items:center;min-height:50vh;text-align:center}
.soonp .card{max-width:560px;padding:28px}
.portal{max-width:860px;margin:0 auto;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.portal-h{background:linear-gradient(160deg,#001C54 0%,#0E3A4E 60%,#285B47 100%);color:#fff;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.portal-h .mono{font-size:22px}
.portal-h .mono i{height:22px}
.welcome{background:linear-gradient(120deg,var(--navy) 0%,#0E3A4E 55%,var(--green) 100%);color:#fff;border-radius:12px;padding:20px 22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 70px,transparent 70px 140px);pointer-events:none}
.welcome h1{color:#fff}
.welcome .sub{color:rgba(255,255,255,.78)}
.welcome .stats{display:flex;gap:28px;position:relative;z-index:1}
.welcome .stats div{display:flex;flex-direction:column}
.welcome .stats b{font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1.1}
.welcome .stats span{font-size:12px;color:rgba(255,255,255,.75)}
.welcome>div{position:relative;z-index:1}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.rep{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:grid;place-items:center}
  .top{padding:10px 16px;flex-wrap:wrap}
  .view{padding:16px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .comp{grid-template-columns:minmax(0,1fr)}
  .ficha-h{grid-template-columns:minmax(0,1fr)}
  .who span{display:none}
}
@media (max-width:640px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signals3{grid-template-columns:minmax(0,1fr)}
  .signals3>div{border-left:0;padding-left:0;border-bottom:1px solid var(--line-2)}
  .signals3>div:last-child{border-bottom:0}
  .kstats,.kstats.s3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kstats>.card{padding:10px 12px}
  .kstats>.card:nth-child(odd){border-left:0;padding-left:0}
  .kstats>.card:nth-child(n+3){border-top:1px solid var(--line)}
  .search{order:3;max-width:none;flex-basis:100%}
  .role{margin-left:0}
  h1{font-size:25px}
  .welcome .stats{gap:18px}
  .cal .dc{min-height:64px}
  .cal .ev{font-size:0;padding:0;height:6px}
}
/* ---- Extensión ---- */
.h1link{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.h1link:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.bnote{border-color:var(--line);background:var(--surface-2)}
.pipe{display:flex;gap:3px}
.pipe i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.pipe i.done{background:var(--good)} .pipe i.cur{background:var(--accent)}
.seg.sm3 button{padding:4px 8px;font-size:12px}
.check.on{border-color:var(--good);background:var(--good);color:#fff}
.check[disabled]{opacity:.4;cursor:not-allowed}
.sim{display:flex;flex-direction:column;gap:14px}

const last = c => c.med.length ? c.med[c.med.length-1] : null;
function compHealth(c){
  const l = last(c); if(!l) return {s:'rojo',why:'Sin mediciones'};
  const p = Math.min(1,Math.max(0,(l.f-c.ini)/(c.fin-c.ini)));
  let s, why, r;
  if(c.tipo==='empleo'){ r = l.v/c.meta; s = r>=1?'verde':r>=0.9?'amarillo':'rojo'; why=`${num(l.v)} de ${num(c.meta)} puestos comprometidos (${Math.round(r*100)}%)`; }
  else if(c.tipo==='certificacion'){ const left = days(c.certFin); if(l.v>=1){s='verde';why=`${c.cert} obtenida`;} else { s = left<0?'rojo':left<120?'amarillo':'verde'; why = left<0?`${c.cert} vencida sin obtener`:`${c.cert} pendiente; plazo ${fdy(c.certFin)}`; } r=l.v; }
  else { r = l.v/c.meta; const gap = r - p; s = gap>=-0.05?'verde':gap>=-0.2?'amarillo':'rojo'; why=`${Math.round(r*100)}% ejecutado vs ${Math.round(p*100)}% esperado a la fecha`; }
  const notaVig = c.nota && c.nota.hasta>TODAY;
  return {s,why,r,p,atenuada: notaVig && s!=='verde'};
}
function compFresh(c){
  const l = last(c); if(!l) return {s:'vieja',d:999};
  const d = -days(l.f), th = TH[c.tipo];
  return {s: d>=th?'vieja':d>=th*0.75?'por':'ok', d, th};
}
const RANK = {verde:0,amarillo:1,rojo:2};
const FRANK = {ok:0,por:1,vieja:2};
function expEval(e){
  let worst='verde', drag=null, fw='ok', fd=0, fdrag=null;
  e.comps.forEach(c=>{ const h=compHealth(c); const eff = h.atenuada?'amarillo':h.s; if(RANK[eff]>RANK[worst] || (RANK[eff]===RANK[worst] && !drag && eff!=='verde')){worst=eff;drag=c;} const f=compFresh(c); if(FRANK[f.s]>FRANK[fw] || (f.s===fw && f.d>fd)){fw=f.s;fd=f.d;fdrag=c;} });
  if(e.override && e.override.hasta>TODAY) worst = e.override.estado;
  return {salud:worst, drag, fresh:fw, freshDays:fd, fdrag};
}

function compChart(c){
  const W=420,H=150,pl=44,pr=14,pt=14,pb=24;
  const pts = c.med; if(!pts.length) return '<div class="empty">Sin mediciones</div>';
  const t0 = c.ini.getTime(), t1 = Math.max(TODAY.getTime()+30*DAY, pts[pts.length-1].f.getTime());
  const maxV = Math.max(c.meta*1.1, ...pts.map(p=>p.v));
  const X = t => pl + (t-t0)/(t1-t0)*(W-pl-pr), Y = v => pt + (1 - v/maxV)*(H-pt-pb);
  const ticks = [0, maxV/2, maxV].map(v=>Math.round(v));
  const fmt = v => c.unidad==='USD' ? (v>=1e6? (v/1e6).toFixed(1).replace('.',',')+' M': Math.round(v/1e3)+' k') : num(v);
  let expected = '';
  if(c.tipo!=='empleo'){ const tEnd = Math.min(t1, c.fin.getTime()); const vEnd = c.meta*((tEnd-t0)/(c.fin-t0)); expected = `<line x1="${X(t0)}" y1="${Y(0)}" x2="${X(tEnd)}" y2="${Y(vEnd)}" stroke="var(--faint)" stroke-dasharray="3 4" stroke-width="1.5"/>`; }
  const path = pts.map((p,k)=>`${k?'L':'M'}${X(p.f.getTime()).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('');
  const area = path + `L${X(pts[pts.length-1].f.getTime())} ${Y(0)}L${X(pts[0].f.getTime())} ${Y(0)}Z`;
  const h = compHealth(c); const col = h.s==='verde'?'var(--good)':h.s==='amarillo'?'var(--warn)':'var(--crit)';
  const yrs=[]; for(let y=new Date(t0).getFullYear()+1; y<=new Date(t1).getFullYear(); y++){ const t=new Date(y+'-01-01').getTime(); if(t>t0&&t<t1) yrs.push(`<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${H-pb}" stroke="var(--line-2)"/><text x="${X(t)}" y="${H-8}" text-anchor="middle">${y}</text>`); }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(c.label)}: evolución contra la meta">
   ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}
   ${yrs.join('')}
   <line x1="${pl}" x2="${W-pr}" y1="${Y(c.meta)}" y2="${Y(c.meta)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/>
   <text x="${pl+6}" y="${Y(c.meta)-6}" text-anchor="start" class="lbl" style="fill:var(--accent)">Meta ${fmt(c.meta)}</text>
   ${expected}

function hbars(rows,{max,fmt=v=>v,color='var(--accent)'}={}){

}
function lineChart(series,{h=170,fmt=v=>v,label}={}){
  const W=560,H=h,pl=36,pr=16,pt=16,pb=26; const vs=series.map(s=>s.v); const mx=Math.max(...vs)*1.15, mn=Math.min(...vs)*0.85;
  const X=i=>pl+i/(series.length-1)*(W-pl-pr), Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const d=series.map((s,i)=>`${i?'L':'M'}${X(i)} ${Y(s.v)}`).join('');
  const lastI=series.length-1;
  return `<svg class="chart lc" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label||'')}">
  ${[mn,(mn+mx)/2,mx].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`).join('')}
  ${series.map((s,i)=>i%2===0||i===lastI?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${s.l}</text>`:'').join('')}
  <path d="${d}L${X(lastI)} ${Y(mn)}L${X(0)} ${Y(mn)}Z" fill="var(--accent)" opacity=".08"/>
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>
  ${series.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s.v)}" r="${i===lastI?5:3}" fill="${i===lastI?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"><title>${s.l}: ${fmt(s.v)}</title></circle>`).join('')}
  <text x="${X(lastI)-8}" y="${Y(series[lastI].v)-10}" text-anchor="end" class="lbl">${fmt(series[lastI].v)}</text>
  </svg>`;
}
function healthStack(counts){
  const tot = counts.verde+counts.amarillo+counts.rojo||1;
  const seg = (k,c) => counts[k] ? `<div title="${SAL[k]}: ${counts[k]}" style="flex:${counts[k]};background:${c};height:100%;"></div>` : '';

/* Cartera */
function filtered(){
  const q = S.q.trim().toLowerCase(); const f=S.f;
  return EXP.filter(e=>{ const ev=expEval(e);
    if(S.role==='asistente' && e.resp!==me()) return false;
    if((e.estado==='Cerrado')!==S.showArch) return false;
    if(q && !(e.soc.toLowerCase().includes(q)||e.num.includes(q)||e.rut.includes(q)||(e.grupo||'').toLowerCase().includes(q))) return false;
    if(f.resp && e.resp!==f.resp) return false; if(f.min && e.min!==f.min) return false;
    if(f.salud && ev.salud!==f.salud) return false; if(f.fresh && ev.fresh!==f.fresh) return false;
    if(f.hz){ const n=nextAction(e); if(days(n.f)>+f.hz) return false; }
    return true; });
}
function sorted(list){
  const k=S.sort.k,d=S.sort.d;
  const key = e => k==='na'?nextAction(e).f.getTime():k==='salud'?-RANK[expEval(e).salud]:k==='fresh'?-expEval(e).freshDays:k==='soc'?e.soc:k==='resp'?P(e.resp).name:k==='min'?e.min:0;
  return [...list].sort((a,b)=>{const x=key(a),y=key(b); return (x>y?1:x<y?-1:0)*d;});
}
function expTable(list,compact=false){
  const th = (k,l) => `<th class="sortable" data-act="sort" data-k="${k}">${l}${S.sort.k===k?(S.sort.d>0?' ↑':' ↓'):''}</th>`;

  </tbody></table>${list.length?'':'<div class="empty">Ningún expediente coincide con los filtros.</div>'}</div>`;

/* Ficha */

  const inArm = e.arm && ARM_ST.includes(e.estado);
  const tabs = [inArm?['armado','Armado']:null,['resumen','Resumen'],['compromisos','Compromisos'],['vencimientos','Vencimientos'],['tareas',`Tareas (${e.tareas.filter(t=>t.estado!=='completada').length})`],['documentos','Documentos'],e.estado==='En seguimiento'?['ciclo','Ciclo anual']:null,['comap','Outputs COMAP'],['irae','IRAE'],['bitacora','Bitácora']].filter(Boolean);
  if(!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  return `<div><button class="btn ghost sm" data-act="nav" data-v="cartera">${ic('back')}Cartera</button></div>
  <div class="ficha-h"><div><p class="eyebrow">Expediente ${e.num} · ${e.min} · ${e.sector}</p><h1><button class="h1link" data-act="soc" data-s="${esc(e.soc)}" title="Ver la sociedad">${esc(e.soc)}</button></h1>
   <div class="meta"><span>RUT <b>${e.rut}</b></span>${e.grupo?`<span>Grupo <b>${esc(e.grupo)}</b></span>`:''}<span>Inversión comprometida <b>${usd(e.monto)}</b></span><span>Responsable <b>${P(e.resp).name}</b></span><span>Estado <b>${e.estado}</b></span>${e.estado==='En seguimiento'?`<span>Operativo <button class="link" data-act="estado-op" data-id="${e.id}">${opState(e)}</button></span>`:''}${e.cierre?`<span class="down">Cerrado el ${fdy(e.cierre.f)} · ${esc(e.cierre.m)}</span>`:''}${e.sensible?`<span class="lock">${ic('lock')}Información sensible</span>`:''}</div></div>
   <div class="btns">${ib('tarea','plus','Nueva tarea',`data-id="${e.id}"`,'solid')}${ib('interaccion','chat','Registrar interacción',`data-id="${e.id}"`,'solid')}<button class="btn pri" data-act="revision" data-id="${e.id}">Enviar a revisión</button>${S.role!=='asistente'?more([e.estado==='Cerrado'?['reabrir','undo','Reabrir expediente',`data-id="${e.id}"`]:['cerrar-exp','folder','Cerrar y archivar',`data-id="${e.id}"`]]):''}</div></div>
  <div class="signals3">
   <div><span class="lab">Salud</span><div>${sig(ev.salud)}</div><span class="small muted">${ev.drag?`Lo arrastra: <b style="color:var(--ink)">${esc(ev.drag.label)}</b>`:'Todos los compromisos en regla'} · <button class="link small" data-act="criterio" data-id="${e.id}">Ver criterio</button></span>${e.override&&e.override.hasta>TODAY?`<span class="chip stale">Excepción vigente hasta ${fd(e.override.hasta)}</span>`:''}</div>
   <div><span class="lab">Frescura del dato</span><div>${fresh(ev.fresh,ev.freshDays)}</div><span class="small muted">${ev.fresh==='ok'?'Todas las mediciones dentro del umbral':`${TLAB[ev.fdrag.tipo]}: umbral ${TH[ev.fdrag.tipo]} días`}</span></div>
   <div><span class="lab">Próxima acción</span><span class="big">${esc(n.t)}</span><span class="small ${n.f<TODAY?'down b':'muted'}">${fdy(n.f)} · ${rel(n.f)} · origen: ${n.src}</span></div>
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}" role="tab">${l}</button>`).join('')}</div>
  ${FT[S.tab](e,ev)}`;
};
const FT = {};
FT.resumen = (e,ev) => `<div class="grid g2">
  <section class="card"><div class="card-h"><h2>Compromisos</h2><button class="link small" data-act="tab" data-t="compromisos">Ver detalle</button></div><div class="list">${e.comps.map(c=>{const h=compHealth(c),f=compFresh(c);const pct=c.tipo==='certificacion'?(last(c).v?100:0):Math.min(100,Math.round(last(c).v/c.meta*100));return `<div class="li"><div class="stripe ${h.s==='verde'?'good':h.s==='amarillo'?'warn':'crit'}"></div><div><div class="t">${esc(c.label)}</div><div class="m"><span>${esc(h.why)}</span>${h.atenuada?'<span class="chip stale">alerta atenuada</span>':''}</div><div class="bar ${h.s==='verde'?'good':h.s==='amarillo'?'warn':'crit'}" style="margin-top:6px;max-width:320px"><i style="width:${pct}%"></i></div></div>${fresh(f.s,f.d)}</div>`}).join('')}</div></section>
  <div class="grid" style="align-content:start">
   ${ev.salud!=='verde'&&ev.drag?`<div class="drag">${ic('alert','width="16" height="16"')}<span>El ${SAL[ev.salud].toLowerCase()} viene de <b>${esc(ev.drag.label)}</b>: ${esc(compHealth(ev.drag).why)}</span></div>`:''}
   <section class="sec"><div class="card-h"><h2>Próximos hitos</h2></div><div class="list">${e.hitos.sort((a,b)=>a.f-b.f).map(h=>`<div class="li"><div class="stripe ${days(h.f)<0?'crit':days(h.f)<=21?'warn':'info'}"></div><div><div class="t">${h.tipo}</div><div class="m">${rel(h.f)}</div></div><span class="small b">${fdy(h.f)}</span></div>`).join('')}</div></section>
   <section class="sec"><div class="card-h"><h2>Últimos movimientos</h2><button class="link small" data-act="tab" data-t="bitacora">Bitácora</button></div>${timeline(e.bit.slice(0,3))}</section>
  </div></div>`;
FT.compromisos = (e) => `<section class="card"><div class="card-h"><div><h2>Compromisos e indicadores</h2><span class="hint">Línea punteada azul: meta. Gris: avance esperado a la fecha.</span></div><button class="btn sm" data-act="fit-extract" data-id="${e.id}">${ic('spark')}Proponer desde el FIT vigente</button></div>${e.comps.map(c=>{const h=compHealth(c),f=compFresh(c),l=last(c);return `<div class="comp"><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(c.label)}</h3>${sig(h.s)}</div>
  <div><span class="num">${c.unidad==='USD'?usd(l.v):c.tipo==='certificacion'?(l.v?'Obtenida':'Pendiente'):num(l.v)}</span> <span class="muted">${c.tipo==='certificacion'?'':`de ${c.unidad==='USD'?usd(c.meta):num(c.meta)+' '+c.unidad}`}</span></div>
  <span class="small muted">${esc(h.why)}</span>
  <div class="btns">${fresh(f.s,f.d)}<span class="chip">Origen: ${l.origen}</span><span class="chip">Ventana ${MES[c.ini.getMonth()]} ${c.ini.getFullYear()} – ${MES[c.fin.getMonth()]} ${c.fin.getFullYear()}</span></div>
  ${c.nota?`<div class="note"><b>Nota de contexto</b> · vigente hasta ${fdy(c.nota.hasta)}<br>${esc(c.nota.texto)}<div class="xs muted" style="margin-top:3px">${esc(c.nota.autor)} · ${fd(c.nota.f)}</div></div>`:''}
  <div class="small">${ic('doc','width="13" height="13" style="vertical-align:-2px;color:var(--muted)"')} Evidencia: ${c.ev||(e.docs.find(d=>d.comp===c.id)||{}).nombre||{empleo:'Planilla BPS del período',inversion:'Mayores 2025.xlsx',capacitacion:'Diplomas y listas de asistencia',certificacion:c.cert?c.cert+'.pdf':'—'}[c.tipo]}</div>
  <div class="btns" style="margin-top:4px"><button class="btn sm pri" data-act="medir" data-id="${c.id}">Registrar medición</button>${ib('nota','note','Nota de contexto',`data-id="${c.id}"`,'solid')}${ib('hist-med','clock','Historial y correcciones',`data-id="${c.id}"`,'solid')}</div></div>
  <div>${c.tipo==='certificacion'?`<div class="callout">${ic('info')}<div><b>${esc(c.cert)}</b><div class="small muted">Plazo comprometido: ${fdy(c.certFin)}. ${l.v?'Certificado vinculado como evidencia.':'Sin certificado cargado.'}</div></div></div>`:compChart(c)}</div></div>`;}).join('')}</section>`;
FT.vencimientos = e => `<section class="card"><div class="list">${[...e.hitos,...e.tareas.filter(t=>t.estado!=='completada').map(t=>({tipo:'Tarea: '+t.titulo,f:t.due}))].sort((a,b)=>a.f-b.f).map(h=>`<div class="li"><div class="stripe ${days(h.f)<0?'crit':days(h.f)<=14?'warn':'info'}"></div><div><div class="t">${esc(h.tipo)}</div><div class="m">${rel(h.f)}</div></div><span class="small b">${fdy(h.f)}</span></div>`).join('')}</div></section>`;
FT.tareas = e => { const ts=e.tareas.filter(t=>t.estado!=='completada'); return `<section class="card"><div class="card-h"><h2>Tareas abiertas</h2><button class="btn sm" data-act="tarea" data-id="${e.id}">${ic('plus')}Nueva tarea</button></div><div class="list">${taskGroups(ts)||'<div class="empty">Sin tareas abiertas</div>'}</div></section>`; };

FT.irae = e => { const r=e.irae; const saldo=r.rec-r.util; const dif = r.decl!=null && r.decl!==r.rec;
  return `<div class="kstats">${[['Recomendado',r.rec,'Cálculo del sistema con topes'],['Declarado (DJ)',r.decl,r.decl==null?'DJ aún no registrada':'Según DJ presentada'],['Utilizado',r.util,'Aplicado en el ejercicio'],['Saldo pendiente',saldo,'Disponible para próximos ejercicios']].map(([l,v,s])=>`<div class="card kpi"><span class="lab">${l}</span><span class="val" style="font-size:24px">${v==null?'—':usd(v)}</span><span class="delta">${s}</span></div>`).join('')}</div>

  <section class="sec"><div class="card-h"><h2>Ciclo IRAE ejercicio ${r.ej}</h2></div><div class="card-b"><div class="steps">${['Cálculo recomendado','Comunicado al estudio contable','DJ registrada','Conciliado','Saldo actualizado'].map((s,i)=>{const done = i<(r.decl==null?2:dif?3:5); const cur = i===(r.decl==null?2:dif?3:5); return `<span class="step ${done?'done':cur?'cur':''}">${done?'✓ ':''}${s}</span>`;}).join('')}</div><p class="small muted" style="margin-top:12px">Tope aplicable: ${usd(r.tope)} (50% de la inversión elegible). Las reglas de tope y proporcionalidad se versionan en Configuración.</p></div></section>`; };
FT.bitacora = e => `<section class="card"><div class="card-h"><h2>Bitácora</h2><button class="btn sm" data-act="interaccion" data-id="${e.id}">${ic('plus')}Registrar</button></div>${timeline(e.bit)}</section>`;
function timeline(items){ return `<div class="timeline">${items.map(b=>`<div class="tl"><span class="dt">${fdy(b.f)}</span><span class="dot ${b.tipo}"></span><div><div>${esc(b.t)}</div><div class="xs muted">${esc(b.autor)} · ${{sys:'Sistema',int:'Interacción',dec:'Decisión',exc:'Excepción'}[b.tipo]||''}</div></div></div>`).join('')}</div>`; }

/* Excepciones */

  return `<div class="li"><div><div class="t">${expLink(x.exp)}</div><div class="small" style="margin-top:2px">${esc(x.why)}</div><div class="m"><span class="dot ${x.sev==='muted'?'':x.sev}"></span><span>${x.tipo}</span><span class="sep">·</span><span>${P(x.exp.resp).name.split(' ')[0]}</span><span class="sep">·</span><span>${rel(x.f)}</span></div></div>
  ${x.sev==='muted'?'':`<div class="acts">${ib('exc-tarea','task','Convertir en tarea',`data-k="${esc(x.exp.id+'|'+x.tipo+'|'+x.why)}"`)}${more([['reasignar','swap','Reasignar expediente',`data-id="${x.exp.id}"`],x.tipo==='Riesgo'?['override','shield','Aplicar excepción al estado',`data-id="${x.exp.id}"`]:null,['open','open','Abrir expediente',`data-id="${x.exp.id}"`]])}</div>`}</div>`;
}
V.excepciones = () => {
  const all = exceptions(); const tipos=['todas','Riesgo','Vencido','Dato desactualizado','Información faltante','Atenuada por nota'];
  const list = all.filter(x=>S.excT==='todas'?x.sev!=='muted':x.tipo===S.excT).filter(x=>!S.f.resp||x.exp.resp===S.f.resp).sort((a,b)=>({crit:0,warn:1,stale:2,muted:3}[a.sev]-{crit:0,warn:1,stale:2,muted:3}[b.sev])||a.f-b.f);
  return `<div class="hd"><div><p class="eyebrow">A07 · Gestión por excepción</p><h1>Centro de excepciones</h1><p class="sub">Todo lo que está fuera de lo normal, venga de donde venga. Cada excepción termina con dueño y acción.</p></div></div>
  <div class="filters"><div class="seg">${tipos.map(t=>`<button class="${S.excT===t?'on':''}" data-act="exc-t" data-t="${t}">${t==='todas'?'Todas':t} <span class="faint">${t==='todas'?all.filter(x=>x.sev!=='muted').length:all.filter(x=>x.tipo===t).length}</span></button>`).join('')}</div>
  <select class="sel" data-act="filter" data-k="resp" aria-label="Responsable"><option value="">Todo el equipo</option>${ASIS.map(id=>`<option value="${id}" ${S.f.resp===id?'selected':''}>${P(id).name}</option>`).join('')}</select></div>
  <section class="card"><div class="list">${list.map(excRow).join('')||'<div class="empty">Sin excepciones en esta vista.</div>'}</div></section>`;
};

/* Calendario */
V.calendario = () => {
  const m = S.calMonth, y=2026; const first = new Date(y,m,1,12), startDow=(first.getDay()+6)%7; const dim = new Date(y,m+1,0).getDate();
  const evs = EXP.flatMap(e=>[...e.hitos.map(h=>({t:h.tipo,f:h.f,e,k:h.tipo==='Seguimiento anual COMAP'?'warn':h.tipo.startsWith('Cierre')?'crit':''})),...e.tareas.filter(t=>t.estado!=='completada').map(t=>({t:t.titulo,f:t.due,e,k:t.due<TODAY?'crit':''}))]);
  const cells=[]; for(let i=0;i<42;i++){ const d=new Date(y,m,1-startDow+i,12); const de=evs.filter(v=>iso(v.f)===iso(d)); cells.push(`<div class="dc ${d.getMonth()!==m?'out':''} ${iso(d)===iso(TODAY)?'today':''}"><span class="dn">${d.getDate()}</span>${de.slice(0,3).map(v=>`<button class="ev ${v.k}" data-act="open" data-id="${v.e.id}" title="${esc(v.t)} · ${esc(v.e.soc)}">${esc(v.e.soc.split(' ')[0])} · ${esc(v.t)}</button>`).join('')}${de.length>3?`<span class="xs muted">+${de.length-3} más</span>`:''}</div>`); if(i>=34 && i%7===6 && new Date(y,m,1-startDow+i+1).getMonth()!==m) break; }
  const hz = evs.filter(v=>days(v.f)>=0&&days(v.f)<=S.hz).sort((a,b)=>a.f-b.f);
  return `<div class="hd"><div><p class="eyebrow">A07 · Vencimientos</p><h1>Vencimientos y obligaciones</h1><p class="sub">Hitos de COMAP, informes, cierres de ventana y tareas, en un solo calendario.</p></div><div class="btns"><button class="btn sm" data-act="cal" data-d="-1">← Anterior</button><b style="min-width:120px;text-align:center">${MESL[m]} ${y}</b><button class="btn sm" data-act="cal" data-d="1">Siguiente →</button></div></div>
  <div class="grid g-main"><section class="card calcard" style="overflow:hidden"><div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells.join('')}</div></section>
  <section class="card"><div class="card-h"><h2>Horizonte de atención</h2><div class="seg">${[[14,'2 sem'],[28,'4 sem'],[60,'2 meses']].map(([v,l])=>`<button class="${S.hz===v?'on':''}" data-act="hz" data-v="${v}">${l}</button>`).join('')}</div></div><div class="list" style="max-height:620px;overflow:auto">${hz.map(v=>`<div class="li"><div class="stripe ${v.k||'info'}"></div><div><div class="t">${esc(v.t)}</div><div class="m">${expLink(v.e)}</div></div><span class="small b" style="white-space:nowrap">${fd(v.f)}</span></div>`).join('')}</div></section></div>`;
};

/* Revisiones */

const solState = s => { const v=s.items.filter(x=>x[1]==='validado').length; return v===s.items.length?'Completa':-days(s.enviada)>20?'Vencida':s.items.some(x=>x[1]!=='pendiente')?'Parcial':'Abierta'; };

function solBlock(s){

    <div class="sol-st"><span class="prog"><i style="width:${v/s.items.length*100}%"></i></span><span class="small muted">${v}/${s.items.length}</span></div><span class="stt ${SOLCL[st]}"><span class="dot ${SOLCL[st]}"></span>${st}</span><span class="slot">${st!=='Completa'?ib('sol-draft','mail','Borrador de email (entrega B)',`data-s="${s.id}"`):''}</span>
    <div class="sol-a slot">${st!=='Completa'?ib('recordar','bell','Recordar los ítems faltantes',`data-s="${s.id}"`):''}</div></header>${st!=='Completa'&&s.recs>=3?`<div class="sol-esc">${s.esc?`<span class="stt crit"><span class="dot crit"></span>Escalada a la manager</span>`:`<span class="small down">${s.recs} recordatorios sin respuesta</span><button class="btn sm" data-act="sol-esc" data-s="${s.id}">${ic('up')}Escalar</button>`}</div>`:''}
   <div class="sol-items">${s.items.map((it,k)=>{ const a=`data-s="${s.id}" data-k="${k}"`;
     const main = it[1]==='recibido'?ib('item','check','Validar',a+' data-v="validado"','good'):(it[1]==='pendiente'||it[1]==='rechazado')?ib('item','inbox','Marcar recibido',a+' data-v="recibido"'):'';
     const sec = it[1]==='recibido'?ib('item','x','Rechazar',a+' data-v="rechazado"','crit'):'';
     return `<div class="sol-i"><span class="nm">${esc(it[0])}</span><span class="stt ${ITC[it[1]]}"><span class="dot ${ITC[it[1]]}"></span>${ITL[it[1]]}</span>${slot(main)}${slot(sec)}</div>`; }).join('')}</div>
  </section>`;
}
V.solicitudes = () => { const list=[...SOLS].sort((a,b)=>SOLORD[solState(a)]-SOLORD[solState(b)]||a.enviada-b.enviada);

/* Informes */

  if(c.tipo==='empleo') out.push(h.s==='verde'?{r:'R-EMP-01',t:'El nivel de empleo cumple el compromiso asumido.',rec:'Mantener el registro trimestral de planillas BPS.'}:{r:'R-EMP-03',t:`El empleo se ubica por debajo del compromiso (${Math.round(h.r*100)}%).`,rec:'Evaluar plan de contratación antes del cierre del ejercicio.'});
  if(c.tipo==='inversion') out.push(h.s==='verde'?{r:'R-INV-01',t:'La inversión avanza en línea con el cronograma.',rec:'Continuar con la ejecución prevista.'}:{r:'R-INV-02',t:`La inversión ejecutada (${Math.round(h.r*100)}%) está por debajo de lo esperado a la fecha (${Math.round(h.p*100)}%).`,rec:'Considerar solicitud de reformulación del cronograma ante COMAP.'});
  if(c.tipo==='capacitacion') out.push(h.atenuada?{r:'R-CAP-04',t:'Capacitación en curso según lo informado por la empresa.',rec:'Remitir constancias al finalizar los cursos.'}:h.s==='verde'?{r:'R-CAP-01',t:'Las horas de capacitación cumplen lo comprometido a la fecha.',rec:'Conservar diplomas y listas de asistencia.'}:{r:'R-CAP-02',t:'Las horas de capacitación están atrasadas respecto del plan.',rec:'Programar cursos en el próximo trimestre.'});
 }); return out; }
function narrative(e,cs){

  return [`Durante el período, ${e.soc} ${ev.salud==='verde'?'mantuvo un nivel de cumplimiento adecuado de los compromisos asumidos ante la COMAP':ev.salud==='amarillo'?'presenta un cumplimiento parcial de sus compromisos, con aspectos que requieren atención':'presenta desvíos relevantes respecto de los compromisos asumidos ante la COMAP'}.`,
  cs.map(c=>c.t).join(' '),
  `Recomendamos: ${cs.map(c=>c.rec.charAt(0).toLowerCase()+c.rec.slice(1).replace(/\.$/,'')).join('; ')}.`];
}

  <section class="card"><div class="tw"><table><thead><tr><th>Sociedad</th><th>Cadencia</th><th>Fecha esperada</th><th>Estado</th><th>Salud</th><th></th></tr></thead><tbody>${due.map(({e,h})=>{const st = e.informeSt || (days(h.f)<0?'Atrasado':days(h.f)<=14?'Próximo':'Al día'); return `<tr><td><div class="b">${esc(e.soc)}</div><div class="exp-n">Exp. ${e.num}</div></td><td class="small">Cada ${e.cadencia} meses</td><td class="small">${fdy(h.f)} <span class="muted">· ${rel(h.f)}</span></td><td><span class="chip ${st==='Atrasado'?'crit':st==='Próximo'?'warn':st==='Aprobado'?'good':st==='En revisión'?'info':''}">${st}</span></td><td>${sig(expEval(e).salud)}</td><td style="text-align:right"><button class="btn sm ${st==='Atrasado'||st==='Próximo'?'pri':''}" data-act="informe" data-id="${e.id}">${st==='Aprobado'?'Ver':'Generar'}</button></td></tr>`;}).join('')}</tbody></table></div></section>`;
};

     <p class="small muted">Las secciones verdes son texto generado: al editarlas quedan registradas como cambio humano.</p>

  <div class="grid g-main"><section class="card"><div class="card-h"><h2>Escenario</h2><button class="btn sm" data-act="sim-save">${ic('plus')}Guardar escenario</button></div><div class="card-b sim">
   <label class="simrow"><span>Inversión elegible</span><input type="range" min="200000" max="5000000" step="50000" value="${simVals.inv}" data-sim="inv"><b>${usd(simVals.inv)}</b></label>
   ${SIM_IND.map(([k,l,u,mn,mx,,w])=>`<label class="simrow"><span>${l}<em>${u} · peso ${Math.round(w*100)}%</em></span><input type="range" min="${mn}" max="${mx}" step="1" value="${simVals[k]}" data-sim="${k}"><b>${simVals[k]}</b></label>`).join('')}
  </div></section>
  <section class="sec"><div class="card-h"><h2>Resultado</h2></div><div class="card-b"><div class="kstats s3 simk" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card kpi"><span class="lab">Puntaje</span><span class="val">${r.p.toFixed(2)}</span><span class="delta">sobre 10</span></div><div class="card kpi"><span class="lab">Exoneración IRAE</span><span class="val">${r.pct}%</span><span class="delta">de la inversión</span></div><div class="card kpi"><span class="lab">Beneficio estimado</span><span class="val">${usd(r.irae)}</span><span class="delta">a utilizar en el plazo</span></div></div>
   <div style="margin-top:14px">${hbars(r.sc.map(x=>({l:SIM_IND.find(i=>i[0]===x.k)[1],v:Math.round(x.s*10)/10})),{max:10,fmt:v=>v.toFixed(1)})}</div></div></section></div>
  ${S.scen.length?`<section class="card"><div class="card-h"><h2>Escenarios guardados</h2><span class="hint">Comparalos antes de presentar</span></div><div class="tw"><table><thead><tr><th>Escenario</th><th class="num-r">Inversión</th>${SIM_IND.map(i=>`<th class="num">${SIM_SHORT[i[0]]}</th>`).join('')}<th class="num">Puntaje</th><th class="num">Exoneración</th><th class="num-r">Beneficio</th></tr></thead><tbody>${S.scen.map((s,i)=>{const x=simCalc(s); const best = Math.max(...S.scen.map(z=>simCalc(z).irae))===x.irae; return `<tr><td class="b">Escenario ${String.fromCharCode(65+i)}${best&&S.scen.length>1?' <span class="stt good"><span class="dot good"></span>mejor</span>':''}</td><td class="num-r">${usd(s.inv)}</td>${SIM_IND.map(ind=>`<td class="num">${s[ind[0]]}</td>`).join('')}<td class="num">${x.p.toFixed(2)}</td><td class="num">${x.pct}%</td><td class="num-r b">${usd(x.irae)}</td></tr>`;}).join('')}</tbody></table></div></section>`:''}`; };

/* Ficha · pestaña Armado (A04) */
FT.armado = e => { const idx=ARM_ST.indexOf(e.estado); const pct=armPct(e); const obsA=e.arm.obs.filter(o=>o.st==='abierta').length;
  const next = {0:['Enviar a revisión interna',pct<100?'Completá el checklist para avanzar':''],1:['Aprobar y pasar a firma',S.role==='asistente'?'Lo aprueba la manager':''],2:['Registrar firma y presentación',''],3:['Registrar aprobación de COMAP',''],4:['Volver a presentar',obsA?'Levantá todas las observaciones para volver a presentar':''],5:['Pasar a seguimiento','']}[idx];
  return `<section class="sec"><div class="card-h"><h2>Etapas del armado</h2><span class="hint">Las transiciones validan que no se saltee ningún paso</span></div><div class="card-b"><div class="steps">${ARM_ST.map((s,i)=>`<span class="step ${i<idx?'done':i===idx?'cur':''}">${i<idx?'✓ ':''}${s}</span>`).join('')}</div>
   <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="arm-next" data-id="${e.id}" ${next[1]?'disabled':''}>${next[0]}</button>${idx===3?`<button class="btn" data-act="arm-obs" data-id="${e.id}">${ic('plus')}Cargar observación de COMAP</button>`:''}${idx===2?(e.firma==='firmado'?`<span class="stt good"><span class="dot good"></span>Delegación firmada</span>`:e.firma==='enviado'?`<button class="btn" data-act="firma-ok" data-id="${e.id}">${ic('check')}Registrar firma recibida</button><span class="small muted">Enviado a firma electrónica</span>`:`<button class="btn" data-act="firma-send" data-id="${e.id}">${ic('pen')}Enviar a firma electrónica <span class="soon" style="margin-left:4px">B</span></button>`):''}${next[1]?`<span class="small muted">${next[1]}</span>`:''}</div></div></section>
  <div class="grid g2"><section class="card"><div class="card-h"><h2>Checklist de información</h2><span class="hint">${pct}% completo</span></div><div class="list">${e.arm.check.map((c,k)=>`<div class="li"><div><div class="t" style="font-weight:500;${c.st==='na'?'color:var(--faint);text-decoration:line-through':''}">${esc(c.it)}</div></div><div class="seg sm3">${[['recibido','Recibido'],['pendiente','Pendiente'],['na','No aplica']].map(([v,l])=>`<button class="${c.st===v?'on':''}" data-act="arm-chk" data-id="${e.id}" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('')}</div>
   ${e.arm.check.some(c=>c.st==='pendiente')?`<div class="card-b" style="border-top:1px solid var(--line-2)"><button class="btn sm" data-act="arm-pedir" data-id="${e.id}">${ic('inbox')}Pedir faltantes al cliente</button></div>`:''}</section>
  <div class="grid" style="align-content:start"><section class="sec"><div class="card-h"><h2>Observaciones de COMAP</h2><span class="hint">${obsA} abiertas</span></div><div class="list">${e.arm.obs.map((o,k)=>`<div class="li"><div><div class="t" style="font-weight:500">${esc(o.t)}</div><div class="m">recibida ${fd(o.f)}${o.st==='levantada'?' · <span class="up">levantada</span>':''}</div></div>${o.st==='abierta'?ib('arm-lev','check','Marcar como levantada',`data-id="${e.id}" data-k="${k}"`,'good solid'):''}</div>`).join('')||'<div class="empty">Sin observaciones</div>'}</div></section>
   <section class="sec"><div class="card-h"><h2>Historial de etapas</h2></div><div class="list">${e.arm.hist.slice().reverse().map(h=>`<div class="li"><div><div class="t" style="font-weight:500">${h.st}</div></div><span class="small muted">${fdy(h.f)}</span></div>`).join('')}${e.arm.presentado?`<div class="li"><div><div class="t" style="font-weight:500">Fecha de presentación</div></div><span class="small b">${fdy(e.arm.presentado)}</span></div>`:''}</div></section></div></div>`; };

/* Ficha · Ciclo anual (A08.1) */
FT.ciclo = e => { const done=e.ciclo.filter(Boolean).length; const allBefore = e.ciclo.slice(0,-1).every(Boolean);
  return `<section class="card"><div class="card-h"><h2>Seguimiento anual COMAP · ejercicio 2025</h2><span class="hint">${done} de ${CICLO.length} pasos</span></div><div class="card-b" style="padding-bottom:4px"><div class="prog" style="width:100%;height:8px"><i style="width:${done/CICLO.length*100}%"></i></div></div>
  <div class="list">${CICLO.map(([s,r],k)=>{const ok=e.ciclo[k]; const can = k===CICLO.length-1 ? allBefore : (k===0||e.ciclo[k-1]); return `<div class="li">${ok?`<span class="check on" aria-label="Hecho">${ic('check')}</span>`:`<button class="check" data-act="ciclo" data-id="${e.id}" data-k="${k}" ${can?'':'disabled'} aria-label="Marcar hecho" data-tip="${can?'Marcar hecho':'Primero el paso anterior'}">${ic('check')}</button>`}<div><div class="t" style="font-weight:500;${ok?'color:var(--muted)':''}">${k+1}. ${s}</div><div class="m">${r}${k===6?' · <button class="link small" data-act="tab" data-t="comap">ir a la prevalidación</button>':''}${k===2||k===5?' · <button class="link small" data-act="tab" data-t="irae">ver IRAE</button>':''}</div></div></div>`;}).join('')}</div></section>
  <p class="small muted" style="margin:0">Cerrar el ciclo anual no cierra el expediente: sigue activo mientras tenga obligaciones.</p>`; };

/* Ficha · Outputs COMAP (A16) */
function prevalidar(e){ const out=[]; const ev=expEval(e);
  e.comps.forEach(c=>{ const f=compFresh(c); if(f.s==='vieja') out.push({sev:'crit',campo:TLAB[c.tipo],msg:`La última medición es de hace ${f.d} días; el trámite pide el período cerrado`,tab:'compromisos'}); });
  e.docs.filter(d=>d.falta).forEach(d=>out.push({sev:'crit',campo:d.tipo,msg:`Falta el documento ${d.nombre}`,tab:'documentos'}));
  if(e.irae.decl==null) out.push({sev:'crit',campo:'IRAE exonerado',msg:'No hay DJ registrada para el ejercicio',tab:'irae'});
  else if(e.irae.decl!==e.irae.rec) out.push({sev:'warn',campo:'IRAE exonerado',msg:`Lo declarado (${usd(e.irae.decl)}) difiere de lo recomendado (${usd(e.irae.rec)})`,tab:'irae'});
  const cap=e.comps.find(c=>c.tipo==='capacitacion'); if(cap && compHealth(cap).s!=='verde') out.push({sev:'warn',campo:'Horas de capacitación',msg:'El avance está por debajo de lo esperado; revisar antes de presentar',tab:'compromisos'});
  if(ev.salud==='rojo') out.push({sev:'warn',campo:'Consistencia',msg:'El expediente está incumpliendo: COMAP puede pedir justificación',tab:'resumen'});
  return out; }
FT.comap = e => { const tr = S.comapTr; const pv = e.prev; const crit = pv?pv.r.filter(x=>x.sev==='crit').length:null;
  const fields = [['RUT de la empresa',e.rut],['N.º de expediente',e.num],['Personal ocupado promedio',num(last(e.comps.find(c=>c.tipo==='empleo')).v)],['Inversión ejecutada (USD)',num(last(e.comps.find(c=>c.tipo==='inversion')).v)],['Horas de capacitación',(e.comps.find(c=>c.tipo==='capacitacion')?num(last(e.comps.find(c=>c.tipo==='capacitacion')).v):'No aplica')],['IRAE exonerado del ejercicio',e.irae.decl!=null?num(e.irae.decl):'—']];
  return `<div class="filters"><div class="seg">${[['anual','Seguimiento anual 2025'],['alta','FIT de alta']].map(([k,l])=>`<button class="${tr===k?'on':''}" data-act="comap-tr" data-k="${k}">${l}</button>`).join('')}</div><span class="small muted">Mapping ${tr==='anual'?'Seguimiento anual v4':'FIT de alta v2'} · vigente desde mar 2026</span></div>
  <section class="card"><div class="card-h"><h2>1 · Prevalidación</h2><button class="btn sm" data-act="prevalidar" data-id="${e.id}">${ic('check')}${pv?'Volver a prevalidar':'Ejecutar prevalidación'}</button></div>
   ${pv?`<div class="list">${pv.r.length?pv.r.map(x=>`<div class="li"><span class="dot ${x.sev}"></span><div><div class="t" style="font-weight:500">${esc(x.campo)}</div><div class="m">${esc(x.msg)}</div></div><button class="btn sm ghost" data-act="tab" data-t="${x.tab}">Ir al campo ${ic('arrow')}</button></div>`).join(''):'<div class="empty">Sin faltantes ni inválidos. Listo para generar.</div>'}</div><div class="card-b xs muted" style="border-top:1px solid var(--line-2)">Ejecutada ${pv.t} · ${crit} críticos · ${pv.r.length-crit} advertencias</div>`:'<div class="empty">Ejecutá la prevalidación para ver qué falta antes de generar el archivo.</div>'}</section>
  <div class="grid g2"><section class="sec"><div class="card-h"><h2>2 · Generar archivo</h2></div><div class="card-b"><p class="small muted" style="margin:0 0 12px">${tr==='anual'?'Excel del seguimiento anual con el formato vigente de COMAP.':'Datos del FIT de alta listos para la carga web.'}</p><button class="btn pri" data-act="comap-gen" data-id="${e.id}" ${!pv||crit?'disabled':''}>${ic('doc')}Generar ${tr==='anual'?'Excel COMAP':'archivo del FIT'}</button>${!pv?'<span class="small muted" style="margin-left:10px">Primero prevalidá</span>':crit?`<span class="small down" style="margin-left:10px">Bloqueado: ${crit} faltantes críticos</span>`:''}<p class="xs muted" style="margin:12px 0 0">La presentación ante COMAP sigue siendo manual.</p></div></section>
  <section class="sec"><div class="card-h"><h2>Historial de exportaciones</h2></div><div class="list">${e.exports.slice().reverse().map(x=>`<div class="li"><div><div class="t" style="font-weight:500">${esc(x.file)}</div><div class="m">${x.tr} · v${x.v} · ${esc(x.u)} · ${fdy(x.f)}</div></div>${ib('abrir-doc','open','Recuperar este archivo','')}</div>`).join('')||'<div class="empty">Todavía no se generó ningún archivo</div>'}</div></section></div>
  <section class="sec"><div class="card-h"><h2>3 · Datos para la carga en el FIT web</h2><span class="hint">En el orden del formulario web</span></div><div class="list">${fields.map(([k,v])=>`<div class="li"><div><div class="m" style="margin:0">${k}</div><div class="t" style="font-weight:500">${esc(v)}</div></div>${ib('copy-val','copy','Copiar valor',`data-v="${esc(v)}"`)}</div>`).join('')}</div></section>`; };

/* Ficha de sociedad (A03.3) */
V.sociedad = () => { const soc=S.soc; const exps=EXP.filter(e=>e.soc===soc); const e0=exps[0]; const grupo=e0&&e0.grupo; const otras = grupo?[...new Set(EXP.filter(e=>e.grupo===grupo&&e.soc!==soc).map(e=>e.soc))]:[];
  const bit = exps.flatMap(e=>e.bit.map(b=>({...b,t:b.t}))).sort((a,b)=>b.f-a.f).slice(0,6);
  return `<div><button class="btn ghost sm" data-act="nav" data-v="cartera">${ic('back')}Cartera</button></div>
  <div class="hd"><div><p class="eyebrow">Sociedad${grupo?' · '+esc(grupo):''}</p><h1>${esc(soc)}</h1><div class="meta"><span>RUT <b>${e0?e0.rut:'—'}</b></span><span>Expedientes <b>${exps.length}</b></span>${otras.length?`<span>Mismo grupo: ${otras.map(o=>`<button class="link" data-act="soc" data-s="${esc(o)}">${esc(o)}</button>`).join(', ')}</span>`:''}</div></div></div>
  <section class="card"><div class="card-h"><h2>Expedientes</h2></div>${expTable(exps)}</section>
  <div class="grid g2"><section class="sec"><div class="card-h"><h2>Contactos</h2><button class="link small" data-act="nueva-contacto" data-s="${esc(soc)}">Agregar</button></div><div class="list">${CONTACTS.filter(c=>c.soc===soc).map(c=>`<div class="li"><span class="av sm">${ini(c.nombre)}</span><div><div class="t" style="font-weight:500">${esc(c.nombre)}</div><div class="m">${esc(c.rol)} · le pedimos: ${esc(c.info)}</div></div></div>`).join('')}</div></section>
  <section class="sec"><div class="card-h"><h2>Actividad reciente</h2></div>${timeline(bit)}</section></div>`; };

/* Configuración editable */
V.config = () => { const t = S.cfgTab || (S.role==='socio'?'usuarios':'reglas');
  const T = S.role==='socio' ? [['usuarios','Usuarios'],['permisos','Permisos'],['datos','Datos personales'],['audit','Auditoría'],['factura','Reglas de facturación'],['reglas','Reglas de salud'],['integraciones','Integraciones']] : [['reglas','Reglas de salud'],['tipos','Tipos de compromiso'],['docs','Tipos documentales'],['mapping','Mapping COMAP'],['avisos','Avisos'],['factura','Reglas de facturación'],['integraciones','Integraciones']];

   <div class="rule"><span class="rk">Inversión</span><span class="small">Verde si el desvío es menor a ${inp('inv',0,' pts')} · Amarillo hasta ${inp('inv',1,' pts')} · Rojo más</span></div>
   <div class="rule"><span class="rk">Capacitación</span><span class="small">Verde si el desvío es menor a ${inp('cap',0,' pts')} · Amarillo hasta ${inp('cap',1,' pts')} · Rojo más</span></div>
   <div class="rule"><span class="rk">Certificación</span><span class="small">Amarillo si faltan menos de ${inp('cert',0,' días')} para el plazo sin certificado</span></div>
   <div class="btns" style="margin-top:12px"><button class="btn pri" data-act="cfg-publish">Publicar como v${(+r.v+0.1).toFixed(1)}</button><span class="small muted">La versión nueva aplica a evaluaciones futuras; el pasado conserva la regla con que se evaluó.</span></div></div></section>
  <section class="sec"><div class="card-h"><h2>Versiones</h2></div><div class="tw"><table><thead><tr><th>Versión</th><th>Vigente desde</th><th>Publicó</th><th>Cambio</th></tr></thead><tbody>${r.hist.map(h=>`<tr><td class="b">v${h[0]}</td><td class="small">${h[1]}</td><td class="small">${h[2]}</td><td class="small muted">${h[3]}</td></tr>`).join('')}</tbody></table></div></section>`; };
CFGV.tipos = () => `<section class="card"><div class="card-h"><h2>Tipos de compromiso</h2><button class="btn sm" data-act="cfg-tipo">${ic('plus')}Nuevo tipo</button></div><div class="tw"><table><thead><tr><th>Tipo</th><th>Unidad</th><th>Medición</th><th class="num">Frescura (días)</th><th>Evidencia requerida</th></tr></thead><tbody>${CFG.tipos.map((t,i)=>`<tr><td class="b">${esc(t[0])}</td><td class="small">${esc(t[1])}</td><td class="small">${esc(t[2])}</td><td class="num"><input class="cin" type="number" value="${t[3]}" data-cfg="tipo" data-i="${i}" aria-label="Frescura ${esc(t[0])}"></td><td class="small muted">${esc(t[4])}</td></tr>`).join('')}</tbody></table></div></section>`;

CFGV.mapping = () => `<section class="card"><div class="card-h"><h2>Mapping COMAP · Seguimiento anual</h2><span class="hint">v4 · vigente desde mar 2026 · v3 consultable</span></div><div class="tw"><table><thead><tr><th>Campo del formulario COMAP</th><th>Dato del sistema</th><th>Transformación</th></tr></thead><tbody>${CFG.map.map(m=>`<tr><td class="b">${m[0]}</td><td class="small">${m[1]}</td><td class="small muted">${m[2]}</td></tr>`).join('')}</tbody></table></div></section><p class="small muted" style="margin:0">Un cambio de formato de COMAP se resuelve editando el mapping, no tocando código.</p>`;

CFGV.datos = () => `<section class="card"><div class="card-h"><h2>Registro de datos personales</h2><span class="hint">Ley 18.331 · qué se trata, por qué y cuánto se guarda</span></div><div class="tw"><table><thead><tr><th>Entidad</th><th>Datos tratados</th><th>Base</th><th>Retención</th></tr></thead><tbody>${CFG.datos.map(d=>`<tr><td class="b">${d[0]}</td><td class="small">${d[1]}</td><td class="small muted">${d[2]}</td><td class="small">${d[3]}</td></tr>`).join('')}</tbody></table></div></section><p class="small muted" style="margin:0">Al vencer la retención, el sistema propone el borrado y lo deja registrado en la auditoría.</p>`;
CFGV.audit = () => { const ents=[...new Set(AUDIT.map(a=>a.ent.split(' ')[0]))]; const fe=S.audF||''; const list=AUDIT.filter(a=>!fe||a.ent.startsWith(fe));
