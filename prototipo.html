/* Solicitudes: pestañas, entrantes y contactos (A17) */
const _solV = V.solicitudes;
V.solicitudes = () => { const t=S.solTab; const pend=ENTR.filter(m=>!m.done).length;
  const tb = tabsBar(t,'sol-t',[['solicitudes','Solicitudes'],['entrantes',`Entrantes${pend?' ('+pend+')':''}`],['contactos','Contactos']]);
  if(t==='solicitudes'){ const h=_solV(); const i=h.indexOf('<p class="small muted"'); return h.slice(0,i)+tb+h.slice(i); }
  const head = `<div class="hd"><div><p class="eyebrow">A17 · Solicitudes de información</p><h1>Solicitudes al cliente</h1><p class="sub">${t==='entrantes'?'Los emails entrantes se asocian solos al expediente cuando la coincidencia es confiable; el resto espera clasificación.':'A quién pedirle cada tipo de información, por sociedad.'}</p></div></div>`;
  if(t==='entrantes') return head+tb+`<section class="card"><div class="list">${ENTR.map(m=>{const e=m.sug&&EXP.find(x=>x.id===m.sug); return `<div class="li" style="align-items:flex-start"><div><div class="t">${esc(m.asunto)}</div><div class="m">${esc(m.de)}<span class="sep">·</span>${rel(m.f)}</div><div class="small" style="margin-top:4px">${esc(m.cuerpo)}</div><div class="m" style="margin-top:6px">${m.done?`<span class="stt good"><span class="dot good"></span>${esc(m.done)}</span>`:e?`<span class="stt ${m.conf>=85?'good':'warn'}"><span class="dot ${m.conf>=85?'good':'warn'}"></span>${m.conf>=85?'Asociado':'Sugerido'}: ${esc(e.soc)} · confianza ${m.conf}%</span>`:'<span class="stt warn"><span class="dot warn"></span>Sin coincidencia: requiere clasificación</span>'}</div></div>${m.done?'':`<div class="acts">${e?ib('entr-bit','doc','Registrar en la bitácora',`data-id="${m.id}"`)+ib('entr-task','task','Convertir en tarea',`data-id="${m.id}"`):''}${ib('entr-class','folder','Clasificar en otro expediente',`data-id="${m.id}"`)}</div>`}</div>`;}).join('')}</div></section>`;
  const socs=[...new Set(CONTACTS.map(c=>c.soc))];
  return head+tb+`<section class="card"><div class="tw"><table><thead><tr><th>Contacto</th><th>Sociedad</th><th>Rol</th><th>Le pedimos</th><th class="num">Solicitudes abiertas</th></tr></thead><tbody>${CONTACTS.slice(0,24).map(c=>{const n=SOLS.filter(s=>s.contacto.includes(c.nombre)&&solState(s)!=='Completa').length; return `<tr><td><div class="b">${esc(c.nombre)}</div><div class="exp-n">${esc(c.email)}</div></td><td class="small"><button class="link" data-act="soc" data-s="${esc(c.soc)}">${esc(c.soc)}</button></td><td class="small">${esc(c.rol)}</td><td class="small muted">${esc(c.info)}</td><td class="num">${n||'<span class="faint">—</span>'}</td></tr>`;}).join('')}</tbody></table></div></section><p class="small muted" style="margin:0">${socs.length} sociedades · ${CONTACTS.length} contactos</p>`; };

/* ---------- Login (A01.1) ---------- */
function renderLogin(){ const r=$('#loginRoot'); if(!S.login){ r.innerHTML=''; return; }
  const rec = S.login==='recover', sent = S.login==='sent';
  r.innerHTML = `<div class="login"><div class="login-box"><div class="mono login-mono">S<i></i>S</div><h1>${rec||sent?'Recuperar acceso':'Ingresá a SSPI'}</h1><p class="sub">${sent?'Si el email está registrado, te enviamos un enlace para crear una contraseña nueva. Vence en 30 minutos.':rec?'Te enviamos un enlace para crear una contraseña nueva.':'Gestión de proyectos de inversión · SS Proyectos'}</p>
  ${sent?`<button class="btn pri wide" data-act="login-back">Volver a ingresar</button>`:`<form data-form="${rec?'recover':'login'}" class="lform"><div class="fld"><label for="lem">Email</label><input id="lem" name="em" type="email" required placeholder="nombre@ssproyectos.com.uy" autocomplete="username"></div>${rec?'':`<div class="fld"><label for="lpw">Contraseña</label><input id="lpw" name="pw" type="password" required autocomplete="current-password"></div><label class="small muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" checked> Mantener la sesión iniciada</label>`}<button class="btn pri wide" type="submit">${rec?'Enviar enlace':'Ingresar'}</button></form>
  <button class="link small" data-act="${rec?'login-back':'login-rec'}">${rec?'Volver':'¿Olvidaste tu contraseña?'}</button>`}
  <div class="login-demo"><span class="xs muted" style="width:100%">Prototipo · entrar directo como</span>${[['asistente','lp'],['manager','cg'],['socio','ab'],['socio','jm']].map(([k,u])=>`<button class="btn sm" data-act="login-as" data-r="${k}" data-u="${u}"><span class="av sm">${avi(P(u).name)}</span>${P(u).name.split(' ')[0]} · ${ROLES[k].label}</button>`).join('')}</div>
  <a class="rebl" href="https://www.rebltech.com" target="_blank" rel="noopener" style="color:var(--faint)">Powered by <span class="rebl-logo" role="img" aria-label="REBL"></span></a></div></div>`; }

/* ---------- Avisos (A07.3 / A08.7) ---------- */
function renderBell(){ const b=$('#bellBtn'); if(!b) return; const list=NOTIFS[S.role]; const n=list.filter((_,i)=>!READ.has(S.role+i)).length;
  b.innerHTML = `${ic('bell')}${n?`<b>${n}</b>`:''}`;
  const p=$('#bellPanel'); p.hidden=!S.notifOpen;
  p.innerHTML = `<div class="np-h"><b>Avisos</b>${n?`<button class="link small" data-act="notif-all">Marcar todo como leído</button>`:''}</div>${list.map(([t,s,exp,icn],i)=>`<button class="np-i ${READ.has(S.role+i)?'read':''}" data-act="notif" data-i="${i}" ${exp?`data-exp="${exp}"`:''}>${ic(icn)}<span><b>${esc(t)}</b><span>${esc(s)}</span></span></button>`).join('')}<div class="np-f xs muted">También llegan por email según Configuración → Avisos</div>`; }

/* ---------- Acciones nuevas ---------- */
document.addEventListener('click', ev => {
  if(S.notifOpen && !ev.target.closest('#bellWrap')){ S.notifOpen=false; renderBell(); }
  const el = ev.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act; const E = id => EXP.find(x=>x.id===id);
  switch(a){
   case 'alta-t': S.altaTab=el.dataset.k; render(); break;
   case 'cfg-t': S.cfgTab=el.dataset.k; render(); break;
   case 'sol-t': S.solTab=el.dataset.k; render(); break;
   case 'comap-tr': S.comapTr=el.dataset.k; render(); break;
   case 'soc': ev.stopPropagation(); S.soc=el.dataset.s; goTo('sociedad'); break;
   case 'open-arm': S.exp=el.dataset.id; S.tab='armado'; goTo('ficha'); break;
   case 'ganar': { const p=PROPS.find(x=>x.id===el.dataset.id); p.estado='Ganada'; HANDOFFS.unshift({f:TODAY,prop:`${p.soc} · ${p.proyecto}`,res:'Marcada como ganada',ok:true}); toast('Propuesta marcada como ganada'); render(); break; }
   case 'handoff': { const p=PROPS.find(x=>x.id===el.dataset.id); const ex=EXP.find(e=>e.soc===p.soc); const load=id=>TASKS().filter(t=>t.resp===id&&t.estado!=='completada').length; const resp=[...ASIS].sort((x,y)=>load(x)-load(y))[0];
     modal('Crear expediente desde la propuesta',`<div class="hand"><div class="hstep ${ex?'warn':'good'}"><span class="dot ${ex?'warn':'good'}"></span><div><b>${ex?'La sociedad ya existe':'Sociedad nueva'}</b><div class="small muted">${ex?`Coincide el RUT ${ex.rut} con ${esc(ex.soc)}. Se vincula, no se duplica.`:`Se crea ${esc(p.soc)} · RUT ${p.rut}`}</div></div></div>
     <div class="hstep good"><span class="dot good"></span><div><b>Datos del proyecto</b><div class="small muted">${esc(p.proyecto)} · ${usd(p.monto)} · ${p.min}</div></div></div>
     <div class="hstep good"><span class="dot good"></span><div><b>Documentos transferidos</b><div class="small muted">Propuesta aceptada, contrato, datos del cliente</div></div></div>
     <div class="hstep good"><span class="dot good"></span><div><b>Checklist de armado</b><div class="small muted">${CHECK_TPL.length} ítems según el tipo de proyecto (${p.tipo})</div></div></div></div>
     <div class="fld"><label for="hr">Responsable (asignado por regla: menor carga)</label><select id="hr" name="r">${ASIS.map(id=>`<option value="${id}" ${id===resp?'selected':''}>${P(id).name} · ${load(id)} tareas</option>`).join('')}</select></div>`,fd=>{
       const base=EXP[30]; const e={...base,id:'E'+(3000+EXP.length),soc:p.soc,rut:ex?ex.rut:p.rut,grupo:ex?ex.grupo:null,min:p.min,sector:SECT[p.min],resp:fd.r,monto:p.monto,num:'2026-10-1-'+ri(1000,9999),tareas:[],bit:[{f:TODAY,tipo:'sys',t:'Expediente creado desde la propuesta aceptada',autor:P(me()).name}],docs:[{tipo:'Propuesta',nombre:'Propuesta aceptada.pdf',ver:'v1',f:TODAY},{tipo:'Contrato',nombre:'Contrato de servicios.pdf',ver:'v1',f:TODAY}],exports:[],ciclo:CICLO.map(()=>false),comps:base.comps,hitos:base.hitos,irae:base.irae};
       initArm(e,'En armado'); e.arm.check.forEach((c,k)=>c.st=k<1?'recibido':'pendiente'); EXP.push(e); p.estado='Expediente creado'; p.exp=e.id;
       HANDOFFS.unshift({f:TODAY,prop:`${p.soc} · ${p.proyecto}`,res:`${ex?'Vinculado a la sociedad existente. ':''}Expediente creado y asignado a ${P(fd.r).name}`,ok:true}); audit('Expediente '+e.id,'Alta','—','Creado desde propuesta'); toast(`Expediente creado y asignado a ${P(fd.r).name.split(' ')[0]}`);
     },'Crear expediente'); break; }
   case 'arm-chk': { const e=E(el.dataset.id); e.arm.check[+el.dataset.k].st=el.dataset.v; render(); break; }
   case 'arm-pedir': { const e=E(el.dataset.id); const items=e.arm.check.filter(c=>c.st==='pendiente').map(c=>[c.it,'pendiente']); const c=CONTACTS.find(x=>x.soc===e.soc); SOLS.unshift({id:'S'+Date.now(),exp:e.id,contacto:c?`${c.nombre} (${c.rol})`:'Contacto principal',enviada:TODAY,recs:0,items}); addBit(e,'Solicitud de faltantes del armado registrada'); toast(`Solicitud creada con ${items.length} ítems`); break; }
   case 'arm-next': { const e=E(el.dataset.id); const idx=ARM_ST.indexOf(e.estado);
     const adv = st => { e.estado=st; e.arm.hist.push({st,f:TODAY}); addBit(e,'Etapa del armado: '+st); audit('Expediente '+e.id,'Etapa',ARM_ST[idx],st); };
     if(idx===2){ modal('Registrar presentación ante COMAP',`<div class="fld"><label for="pf">Fecha de presentación</label><input id="pf" name="f" type="date" required value="${iso(TODAY)}"></div><p class="small muted" style="margin:0">La presentación queda como hito del expediente.</p>`,fd=>{ e.arm.presentado=new Date(fd.f+'T12:00:00'); adv('Presentado'); toast('Presentación registrada'); },'Registrar'); break; }
     if(idx===4){ adv('Presentado'); toast('Observaciones levantadas: vuelve a Presentado'); render(); break; }
     if(idx===5){ e.estado='En seguimiento'; addBit(e,'Proyecto aprobado: pasa a seguimiento'); toast('Pasa a seguimiento: se cargan compromisos e hitos'); S.tab='resumen'; render(); break; }
     adv(ARM_ST[idx+1]); toast('Avanza a '+ARM_ST[idx+1]); render(); break; }
   case 'arm-obs': { const e=E(el.dataset.id); modal('Observación recibida de COMAP',`<div class="fld"><label for="ot">Qué pide el organismo</label><textarea id="ot" name="t" required></textarea></div>`,fd=>{ e.arm.obs.push({f:TODAY,t:fd.t,st:'abierta'}); if(e.estado==='Presentado'){ e.estado='Con observaciones'; e.arm.hist.push({st:'Con observaciones',f:TODAY}); } addBit(e,'Observación de COMAP: '+fd.t); toast('Observación cargada: el expediente pasa a Con observaciones'); },'Cargar'); break; }
   case 'arm-lev': { const e=E(el.dataset.id); e.arm.obs[+el.dataset.k].st='levantada'; addBit(e,'Observación de COMAP levantada'); toast('Observación levantada'); render(); break; }
   case 'ciclo': { if(el.disabled) break; const e=E(el.dataset.id); const k=+el.dataset.k; e.ciclo[k]=true; addBit(e,'Ciclo anual: '+CICLO[k][0]); toast(k===CICLO.length-1?'Ciclo anual cerrado con su constancia':'Paso completado'); render(); break; }
   case 'prevalidar': { const e=E(el.dataset.id); e.prev={r:prevalidar(e),t:'hoy '+new Date().toTimeString().slice(0,5)}; render(); break; }
   case 'comap-gen': { if(el.disabled) break; const e=E(el.dataset.id); const v=(e.exports.filter(x=>x.tr.startsWith(S.comapTr==='anual'?'Seguimiento':'FIT')).length)+1; const file=S.comapTr==='anual'?`SeguimientoAnual_2025_${e.num}_v${v}.xlsx`:`FIT_alta_${e.num}_v${v}.xlsx`; e.exports.push({v,f:TODAY,u:P(me()).name,tr:S.comapTr==='anual'?'Seguimiento anual 2025':'FIT de alta',file}); addBit(e,'Archivo COMAP generado: '+file); toast('Archivo generado: '+file); render(); break; }
   case 'copy-val': navigator.clipboard?.writeText(el.dataset.v).then(()=>toast('Valor copiado'),()=>toast('No se pudo copiar')); break;
   case 'sim-save': S.scen.push({...simVals}); if(S.scen.length>3) S.scen.shift(); toast('Escenario guardado'); render(); break;
   case 'cfg-publish': { const r=CFG.rules; const nv=(+r.v+0.1).toFixed(1); r.hist.unshift([nv,'hoy',P(me()).name,'Ajuste de umbrales desde Configuración']); audit('Regla de salud','Versión vigente','v'+r.v,'v'+nv); r.v=nv; r.desde='hoy'; toast('Publicada la v'+nv+': aplica a evaluaciones futuras'); render(); break; }
   case 'cfg-tipo': modal('Nuevo tipo de compromiso',`<div class="fld"><label for="tn">Nombre</label><input id="tn" name="n" required placeholder="Ej.: Producción más limpia"></div><div class="grid g2"><div class="fld"><label for="tu">Unidad</label><input id="tu" name="u" required placeholder="% de la inversión"></div><div class="fld"><label for="tp">Medición</label><select id="tp" name="p"><option>Trimestral</option><option>Semestral</option><option>Anual</option></select></div></div><div class="grid g2"><div class="fld"><label for="tf">Frescura (días)</label><input id="tf" name="f" type="number" value="180"></div><div class="fld"><label for="te">Evidencia</label><input id="te" name="e" placeholder="Documento que lo respalda"></div></div>`,fd=>{ CFG.tipos.push([fd.n,fd.u,fd.p,+fd.f,fd.e||'—']); audit('Tipo de compromiso',fd.n,'—','Creado'); toast('Tipo de compromiso creado'); },'Crear'); break;
   case 'cfg-doc-del': { const d=CFG.docs.splice(+el.dataset.i,1)[0]; audit('Tipos documentales',d,'activo','eliminado'); render(); break; }
   case 'cfg-user': modal('Invitar usuario',`<div class="fld"><label for="un">Nombre</label><input id="un" name="n" required></div><div class="fld"><label for="ue">Email</label><input id="ue" name="e" type="email" required></div><div class="fld"><label for="ur">Rol</label><select id="ur" name="r"><option>Asistente</option><option>Manager</option><option>Socio</option><option>Facturación</option></select></div><p class="small muted" style="margin:0">Recibe un email para definir su contraseña.</p>`,fd=>{ PEOPLE.push({id:'u'+Date.now(),name:fd.n,role:fd.r}); audit('Usuario '+fd.n,'Alta','—',fd.r); toast('Invitación enviada a '+fd.e); },'Invitar'); break;
   case 'audit-exp': { const csv=['Fecha,Usuario,Entidad,Campo,Antes,Después',...AUDIT.map(a=>[fdy(a.f),a.u,a.ent,a.campo,a.antes,a.despues].map(x=>`"${x}"`).join(','))].join('\n'); navigator.clipboard?.writeText(csv).then(()=>toast('Auditoría copiada como CSV'),()=>toast('No se pudo copiar')); break; }
   case 'entr-bit': case 'entr-task': { const m=ENTR.find(x=>x.id===el.dataset.id); const e=E(m.sug); if(a==='entr-bit'){ addBit(e,`Email de ${m.de}: ${m.asunto}`,'int'); m.done='Registrado en la bitácora de '+e.soc; } else { e.tareas.push({id:'T'+Date.now(),exp:e.id,titulo:'Responder: '+m.asunto,resp:e.resp,due:addD(TODAY,2),estado:'abierta',origen:'Email'}); m.done='Tarea creada para '+P(e.resp).name.split(' ')[0]; } toast(m.done); render(); break; }
   case 'entr-class': { const m=ENTR.find(x=>x.id===el.dataset.id); modal('Clasificar email',`<p class="small muted" style="margin:0">${esc(m.asunto)} · ${esc(m.de)}</p><div class="fld"><label for="ce">Expediente</label><select id="ce" name="e">${EXP.map(x=>`<option value="${x.id}" ${x.id===m.sug?'selected':''}>${esc(x.soc)} · ${x.num}</option>`).join('')}</select></div><div class="fld"><label for="ca">Qué hacer</label><select id="ca" name="a"><option value="bit">Registrar en la bitácora</option><option value="task">Convertir en tarea</option></select></div>`,fd=>{ const e=E(fd.e); m.sug=fd.e; m.conf=100; if(fd.a==='bit'){ addBit(e,`Email de ${m.de}: ${m.asunto}`,'int'); m.done='Registrado en la bitácora de '+e.soc; } else { e.tareas.push({id:'T'+Date.now(),exp:e.id,titulo:'Responder: '+m.asunto,resp:e.resp,due:addD(TODAY,2),estado:'abierta',origen:'Email'}); m.done='Tarea creada en '+e.soc; } toast(m.done); },'Clasificar'); break; }
   case 'nueva-contacto': { const soc=el.dataset.s; modal('Nuevo contacto · '+soc,`<div class="fld"><label for="cn">Nombre</label><input id="cn" name="n" required></div><div class="fld"><label for="cr">Rol</label><select id="cr" name="r">${ROLESC.map(r=>`<option>${r[0]}</option>`).join('')}</select></div><div class="fld"><label for="cm">Email</label><input id="cm" name="m" type="email" required></div>`,fd=>{ const r=ROLESC.find(x=>x[0]===fd.r); CONTACTS.push({id:'C'+Date.now(),soc,nombre:fd.n,rol:fd.r,info:r[1],email:fd.m}); toast('Contacto agregado'); },'Agregar'); break; }
   case 'logout': S.login='login'; renderLogin(); break;
   case 'login-rec': S.login='recover'; renderLogin(); break;
   case 'login-back': S.login='login'; renderLogin(); break;

const MAY_STEPS = ['Carga','Normalización','Proveedores','Clasificación','Casos ambiguos','Conciliación'];
const CATS = ['Maquinaria y equipos','Obra civil','Equipamiento informático','Vehículos utilitarios','No computa'];
function mayData(e){ if(e.may) return e.may; const prov=[['Metalúrgica Oriental S.A.','METALURGICA ORIENTAL SA','Metalúrgica Oriental'],['Construcciones del Plata SRL','CONST. DEL PLATA'],['Tecno Sur S.A.','TECNOSUR SA'],['Automotora Norte S.A.'],['Papelería Central']];
  const movs=[]; for(let i=0;i<16;i++){ const p=prov[i%5]; const cat=[0,1,2,3,4][i%5]; const conf = i===3||i===11?58:i===7?66:88+((i*7)%11); movs.push({id:i,f:addD(TODAY,-(250-i*12)),desc:['Torno CNC y accesorios','Avance de obra nave 2','Servidores y switches','Camioneta de reparto','Útiles de oficina'][i%5]+(i>9?' (2.ª cuota)':''),prov:p[i%p.length],provN:p[0],imp:[48000,36500,12800,27900,640][i%5]*(1+(i%3)*0.15),sug:CATS[cat],conf,st:conf>=85?'sugerido':'ambiguo',cat:null}); }
  e.may={step:3,movs,comp:{'Maquinaria y equipos':e.monto*0.45,'Obra civil':e.monto*0.35,'Equipamiento informático':e.monto*0.12,'Vehículos utilitarios':e.monto*0.08},closed:false}; return e.may; }
V.mayores = () => { const opts=EXP.filter(e=>e.estado==='En seguimiento'&&(S.role!=='asistente'||e.resp===me())); const e=EXP.find(x=>x.id===S.mayExp)||opts[0]; S.mayExp=e.id; const m=mayData(e);
  const acc=m.movs.filter(x=>x.st==='aceptado'), amb=m.movs.filter(x=>x.st==='ambiguo'), pend=m.movs.filter(x=>x.st==='sugerido');
  const byCat=c=>acc.filter(x=>(x.cat||x.sug)===c).reduce((a,x)=>a+x.imp,0);
  return bHead('B23','Conciliación de mayores','Del libro mayor de cada sociedad a la inversión que efectivamente computa. Nada impacta el indicador sin validación humana.') + bBanner('Mayores contables y conciliación de inversiones (B23)') +
  `<div class="filters"><select class="sel" data-act="may-exp" aria-label="Expediente">${opts.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.soc)}</option>`).join('')}</select><span class="small muted">Mayores 2025 v2.xlsx · ${m.movs.length} movimientos leídos · 2 descartados (saldo inicial y cierre)</span></div>
  <div class="steps">${MAY_STEPS.map((s,i)=>`<span class="step ${i<m.step||m.closed?'done':i===m.step?'cur':''}">${i<m.step||m.closed?'✓ ':''}${s}</span>`).join('')}</div>
  <section class="card"><div class="card-h"><h2>Clasificación asistida</h2><div class="btns"><span class="hint">${pend.length} sugeridos · ${amb.length} ambiguos · ${acc.length} validados</span><button class="btn sm pri" data-act="may-lote" ${pend.filter(x=>x.conf>=90).length?'':'disabled'}>${ic('check')}Aceptar en lote (confianza ≥ 90%)</button></div></div>
   <div class="tw"><table><thead><tr><th>Movimiento</th><th>Proveedor</th><th class="num-r">Importe (USD)</th><th>Categoría</th><th class="num">Confianza</th><th></th></tr></thead><tbody>${m.movs.slice().sort((a,b)=>(a.st==='ambiguo'?-1:0)-(b.st==='ambiguo'?-1:0)||b.imp-a.imp).map(x=>`<tr><td><div class="b">${esc(x.desc)}</div><div class="exp-n">${fdy(x.f)}</div></td><td class="small">${esc(x.provN)}${x.prov!==x.provN?`<div class="xs muted">unificado desde "${esc(x.prov)}"</div>`:''}</td><td class="num-r">${num(x.imp)}</td><td>${x.st==='aceptado'?`<span class="small">${esc(x.cat||x.sug)}</span>`:`<select class="sel" data-act="may-cat" data-id="${x.id}" aria-label="Categoría">${CATS.map(c=>`<option ${c===(x.cat||x.sug)?'selected':''}>${c}</option>`).join('')}</select>`}</td><td class="num"><span class="small ${x.conf<70?'down b':x.conf<85?'':'up'}">${x.conf}%</span></td><td class="act-c">${x.st==='aceptado'?'<span class="stt good"><span class="dot good"></span>Validado</span>':ib('may-ok','check',x.st==='ambiguo'?'Resolver con esta categoría':'Aceptar',`data-id="${x.id}"`,'good solid')}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="sec"><div class="card-h"><h2>Conciliación contra lo comprometido</h2><span class="hint">Solo movimientos validados</span></div><div class="tw"><table><thead><tr><th>Categoría comprometida</th><th class="num-r">Comprometido</th><th class="num-r">Contabilizado</th><th class="num-r">Desvío</th></tr></thead><tbody>${Object.entries(m.comp).map(([c,v])=>{const k=byCat(c); return `<tr><td class="b">${c}</td><td class="num-r">${usd(v)}</td><td class="num-r">${usd(k)}</td><td class="num-r ${k<v*0.5?'down':''}">${usd(k-v)}</td></tr>`;}).join('')}</tbody></table></div>

   case 'done': { const t=findTask(el.dataset.id); t.estado='completada'; addBit(EXP.find(e=>e.id===t.exp),'Tarea completada: '+t.titulo); toast('Tarea completada y registrada en la bitácora'); render(); break; }
   case 'block': { const t=findTask(el.dataset.id); modal('Bloquear tarea',`<div class="fld"><label for="bq">Causa del bloqueo</label><select id="bq" name="c"><option>Esperando respuesta del cliente</option><option>Falta firma del socio</option><option>Estudio contable no envió información</option><option>Esperando respuesta de COMAP</option></select></div>`,fd=>{t.estado='bloqueada';t.bloqueo=fd.c;toast('Tarea marcada como bloqueada');},'Bloquear'); break; }
   case 'unblock': { const t=findTask(el.dataset.id); t.estado='abierta'; t.bloqueo=null; toast('La tarea vuelve a la cola'); render(); break; }
   case 'escalar': { const t=findTask(el.dataset.id); modal('Escalar a manager',`<p class="small muted">${esc(t.titulo)}</p><div class="fld"><label for="em">Motivo</label><textarea id="em" name="m" required placeholder="Qué pasó y qué necesitás que se decida"></textarea></div>`,fd=>{REVS.unshift({id:'R'+Date.now(),tipo:'Caso escalado',exp:t.exp,autor:me(),nivel:'Manager',desde:TODAY,detalle:fd.m,estado:'pendiente'}); addBit(EXP.find(e=>e.id===t.exp),'Escalado a manager: '+fd.m); toast('Escalado. Carolina lo verá en sus revisiones');},'Escalar'); break; }
   case 'medir': { const [e,c]=findComp(el.dataset.id); const l=last(c); modal('Registrar medición · '+c.label,`<p class="small muted">${esc(e.soc)} · última: ${c.unidad==='USD'?usd(l.v):num(l.v)} el ${fdy(l.f)}</p><div class="fld"><label for="mv">Valor (${c.unidad})</label><input id="mv" name="v" type="number" min="0" required value="${l.v}"></div><div class="fld"><label for="me">Evidencia</label><select id="me" name="ev"><option>Planilla BPS del período (SharePoint)</option><option>Comprobantes contables</option><option>Constancias de cursos</option></select></div>`,fd=>{ const before=expEval(e); c.med.push({f:TODAY,v:+fd.v,autor:P(me()).name,origen:'Manual'}); const after=expEval(e); addBit(e,`Medición registrada: ${c.label} = ${c.unidad==='USD'?usd(+fd.v):num(+fd.v)}`); toast(`Medición validada. Salud: ${SAL[after.salud]} · frescura recalculada`); },'Validar y recalcular'); break; }
   case 'nota': { const [e,c]=findComp(el.dataset.id); modal('Nota de contexto · '+c.label,`<p class="small muted">Mientras esté vigente, la alerta de este indicador se atenúa.</p><div class="fld"><label for="nt">Qué informó el cliente</label><textarea id="nt" name="t" required>${c.nota?esc(c.nota.texto):''}</textarea></div><div class="fld"><label for="nh">Vigente hasta</label><input id="nh" name="h" type="date" required value="${iso(addD(TODAY,45))}"></div>`,fd=>{c.nota={texto:fd.t,hasta:new Date(fd.h+'T12:00:00'),autor:P(me()).name,f:TODAY}; addBit(e,'Nota de contexto: '+fd.t); toast('Nota guardada; la alerta queda atenuada');}); break; }
   case 'tarea': { const e=EXP.find(x=>x.id===el.dataset.id); modal('Nueva tarea',`<div class="fld"><label for="tt">Título</label><input id="tt" name="t" required placeholder="Ej.: Pedir planillas BPS del trimestre"></div><div class="grid g2"><div class="fld"><label for="tr">Responsable</label><select id="tr" name="r">${ASIS.map(id=>`<option value="${id}" ${id===e.resp?'selected':''}>${P(id).name}</option>`).join('')}</select></div><div class="fld"><label for="td">Vence</label><input id="td" name="d" type="date" required value="${iso(addD(TODAY,7))}"></div></div>`,fd=>{e.tareas.push({id:'T'+(tid++),exp:e.id,titulo:fd.t,resp:fd.r,due:new Date(fd.d+'T12:00:00'),estado:'abierta',origen:'Manual'}); addBit(e,'Tarea creada: '+fd.t); toast('Tarea creada');},'Crear tarea'); break; }
   case 'interaccion': { const e=EXP.find(x=>x.id===el.dataset.id); modal('Registrar interacción',`<div class="fld"><label for="it">Tipo</label><select id="it" name="k"><option value="int">Llamada / reunión / mail</option><option value="dec">Decisión con fundamento</option></select></div><div class="fld"><label for="ix">Detalle</label><textarea id="ix" name="t" required></textarea></div>`,fd=>{addBit(e,fd.t,fd.k); toast('Registrado en la bitácora');}); break; }
   case 'revision': { const e=EXP.find(x=>x.id===el.dataset.id); REVS.unshift({id:'R'+Date.now(),tipo:'Revisión de expediente',exp:e.id,autor:me(),nivel:expEval(e).salud==='rojo'?'Socio':'Manager',desde:TODAY,detalle:'Pedido desde la ficha',estado:'pendiente'}); addBit(e,'Enviado a revisión'); toast(`Enviado a revisión, nivel ${expEval(e).salud==='rojo'?'Socio (riesgo alto)':'Manager'}`); render(); break; }
   case 'rev': { const r=REVS.find(x=>x.id===el.dataset.id); const res=el.dataset.r; const apply = obs => { if(res==='aprobada' && r.ov) EXP.find(e=>e.id===r.exp).override=r.ov; if(res==='escalada'){ r.nivel='Socio'; toast('Escalado al nivel socio'); } else { r.estado=res; toast('Revisión '+res); } addBit(EXP.find(e=>e.id===r.exp),`${r.tipo}: ${res}${obs?' · '+obs:''}`,'dec'); };
     if(res==='aprobada'){ apply(); render(); } else modal(res==='escalada'?'Escalar a socios':res==='devuelta'?'Devolver con observaciones':'Rechazar',`<div class="fld"><label for="ro">${res==='rechazada'?'Motivo (obligatorio)':'Observaciones'}</label><textarea id="ro" name="o" required></textarea></div>`,fd=>apply(fd.o),res==='escalada'?'Escalar':res==='devuelta'?'Devolver':'Rechazar'); break; }
   case 'exc-tarea': { const [id,tipo,why]=el.dataset.k.split('|'); const e=EXP.find(x=>x.id===id); e.tareas.push({id:'T'+(tid++),exp:id,titulo:tipo==='Dato desactualizado'?'Pedir medición actualizada al cliente':tipo==='Información faltante'?why.replace('Falta ','Conseguir '):'Analizar desvío: '+why.split(':')[0],resp:e.resp,due:addD(TODAY,5),estado:'abierta',origen:'Alerta'}); RESUELTAS.add(id+tipo+why); addBit(e,'Excepción convertida en tarea: '+why); toast(`Tarea asignada a ${P(e.resp).name}`); render(); break; }
   case 'reasignar': { const e=EXP.find(x=>x.id===el.dataset.id); const load=id=>TASKS().filter(t=>t.resp===id&&t.estado!=='completada').length; modal('Reasignar expediente',`<p class="small muted">${esc(e.soc)} · hoy de ${P(e.resp).name}</p><div class="fld"><label>Carga de quien recibe</label>${ASIS.filter(id=>id!==e.resp).map(id=>`<label style="display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-weight:400;color:var(--ink)"><input type="radio" name="r" value="${id}" required> ${P(id).name}<span class="small muted" style="margin-left:auto">${EXP.filter(x=>x.resp===id).length} exp. · ${load(id)} tareas · ${EXP.filter(x=>x.resp===id).flatMap(x=>x.hitos).filter(h=>days(h.f)>=0&&days(h.f)<=30).length} venc. 30 d</span></label>`).join('')}</div><div class="fld"><label for="rm">Motivo</label><input id="rm" name="m" required placeholder="Ej.: licencia, redistribución de carga"></div>`,fd=>{const prev=P(e.resp).name; e.resp=fd.r; e.tareas.forEach(t=>t.resp=fd.r); addBit(e,`Reasignado de ${prev} a ${P(fd.r).name}: ${fd.m}`); toast('Expediente reasignado con registro del motivo');},'Reasignar'); break; }
   case 'override': { const e=EXP.find(x=>x.id===el.dataset.id); modal('Aplicar excepción al estado',`<p class="small muted">El estado calculado de ${esc(e.soc)} es <b>Incumpliendo</b>. Una excepción requiere motivo, vigencia y aprobación de socios.</p><div class="fld"><label for="oe">Nuevo estado</label><select id="oe" name="s"><option value="amarillo">En riesgo</option><option value="verde">Cumpliendo</option></select></div><div class="fld"><label for="om">Motivo</label><textarea id="om" name="m" required></textarea></div><div class="fld"><label for="oh">Vence</label><input id="oh" name="h" type="date" required value="${iso(addD(TODAY,60))}"></div>`,fd=>{REVS.unshift({id:'R'+Date.now(),tipo:'Excepción al estado calculado',exp:e.id,autor:me(),nivel:'Socio',desde:TODAY,detalle:`${SAL[fd.s]} hasta ${fd.h}: ${fd.m}`,estado:'pendiente',ov:{estado:fd.s,hasta:new Date(fd.h+'T12:00:00')}}); addBit(e,'Excepción solicitada: '+fd.m,'exc'); toast('Excepción enviada a aprobación de socios');},'Enviar a aprobación'); break; }
   case 'item': { const s=SOLS.find(x=>x.id===el.dataset.s); s.items[+el.dataset.k][1]=el.dataset.v; const e=EXP.find(x=>x.id===s.exp); addBit(e,`Solicitud: ${s.items[+el.dataset.k][0]} → ${el.dataset.v}`); toast(s.items.every(x=>x[1]==='validado')?'Todos los ítems validados: solicitud cerrada':'Ítem '+el.dataset.v); render(); break; }
   case 'recordar': { const s=SOLS.find(x=>x.id===el.dataset.s); s.recs++; const e=EXP.find(x=>x.id===s.exp); e.tareas.push({id:'T'+(tid++),exp:e.id,titulo:'Reiterar pedido: '+s.items.filter(x=>x[1]!=='validado').map(x=>x[0]).join(', '),resp:e.resp,due:addD(TODAY,2),estado:'abierta',origen:'Alerta'}); toast('Recordatorio creado como tarea, solo por los ítems faltantes'); render(); break; }
   case 'nueva-sol': case 'pedir': { const e = el.dataset.id?EXP.find(x=>x.id===el.dataset.id):null; modal('Nueva solicitud',`<div class="fld"><label for="se">Expediente</label><select id="se" name="e">${EXP.map(x=>`<option value="${x.id}" ${e&&e.id===x.id?'selected':''}>${esc(x.soc)}</option>`).join('')}</select></div><div class="fld"><label for="sc">Contacto</label><input id="sc" name="c" required placeholder="Elegí un contacto o escribí uno nuevo" list="contactsDL"><datalist id="contactsDL">${CONTACTS.filter(c=>!e||c.soc===e.soc).map(c=>`<option value="${esc(c.nombre)} (${esc(c.rol)})"></option>`).join('')}</datalist></div><div class="fld"><label for="si">Ítems (uno por línea)</label><textarea id="si" name="i" required>${el.dataset.doc||''}</textarea></div>`,fd=>{SOLS.unshift({id:'S'+Date.now(),exp:fd.e,contacto:fd.c,enviada:TODAY,recs:0,items:fd.i.split('\n').filter(Boolean).map(x=>[x.trim(),'pendiente'])}); toast('Solicitud registrada. Enviala desde tu correo y quedará trazada'); if(S.view!=='solicitudes'){S.view='solicitudes';}},'Registrar'); break; }
   case 'informe': S.informe=el.dataset.id; render(); window.scrollTo(0,0); break;
   case 'informe-back': S.informe=null; render(); break;
   case 'regen': { const e=EXP.find(x=>x.id===S.informe); e.narr[0] = `En el período analizado, la empresa ${e.soc} ${expEval(e).salud==='verde'?'muestra una evolución favorable en el cumplimiento de sus compromisos':'registra avances, aunque persisten desvíos que conviene atender antes del próximo seguimiento anual'}.`; toast('Párrafo 1 regenerado'); render(); break; }
   case 'inf-rev': { const e=EXP.find(x=>x.id===el.dataset.id); document.querySelectorAll('.ai-p').forEach(p=>{ const t=[...p.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim(); if(t) e.narr[+p.dataset.p]=t; }); e.informeSt='En revisión'; REVS.unshift({id:'R'+Date.now(),tipo:'Informe de seguimiento',exp:e.id,autor:me(),nivel:'Manager',desde:TODAY,detalle:'Generado en el sistema',estado:'pendiente'}); addBit(e,'Informe enviado a aprobación'); toast('Informe enviado a aprobación'); render(); break; }
   case 'inf-ok': { const e=EXP.find(x=>x.id===el.dataset.id); e.informeSt='Aprobado'; e.informeBy=P(me()).name; addBit(e,'Informe aprobado por '+P(me()).name,'dec'); toast('Informe aprobado'); render(); break; }
   case 'inf-dev': { const e=EXP.find(x=>x.id===el.dataset.id); e.informeSt='Borrador'; addBit(e,'Informe devuelto con observaciones'); toast('Devuelto al autor'); render(); break; }
   case 'inf-send': { const e=EXP.find(x=>x.id===el.dataset.id); addBit(e,'Informe exportado y enviado a gerencia general'); toast('Envío registrado con versión, destinatario y fecha'); break; }
   case 'facturar': { const f=FACT.find(x=>x.id===el.dataset.id); const e=EXP.find(x=>x.id===f.exp); modal('Registrar factura emitida',`<p class="small muted">${esc(e.soc)} · ${esc(f.hito)}. Datos precargados desde el expediente.</p><div class="grid g2"><div class="fld"><label for="fn">Número</label><input id="fn" name="n" required value="A-00${4830+Math.floor(Math.random()*50)}"></div><div class="fld"><label for="fm">Importe (USD)</label><input id="fm" name="m" type="number" required value="${f.monto}"></div></div><div class="fld"><label for="fv">Vencimiento</label><input id="fv" name="v" type="date" required value="${iso(addD(TODAY,30))}"></div>`,fd=>{f.estado='facturado';f.nro=fd.n;f.monto=+fd.m;f.vence=new Date(fd.v+'T12:00:00'); toast('Factura registrada contra el hito');},'Registrar'); break; }
   case 'cobrar': { const f=FACT.find(x=>x.id===el.dataset.id); const pend=f.saldo||f.monto; modal('Registrar pago',`<p class="small muted">Factura ${f.nro} · saldo ${usd(pend)}</p><div class="fld"><label for="pm">Importe recibido (USD)</label><input id="pm" name="m" type="number" required max="${pend}" value="${pend}"></div><div class="fld"><label for="pmed">Medio</label><select id="pmed" name="x"><option>Transferencia</option><option>Cheque</option></select></div>`,fd=>{const s=pend-(+fd.m); if(s<=0){f.estado='cobrado';f.saldo=0;toast('Factura cobrada: saldo cero');}else{f.saldo=s;toast('Pago parcial registrado. Saldo '+usd(s));}},'Registrar pago'); break; }
   case 'reclamo': { const f=FACT.find(x=>x.id===el.dataset.id); const e=EXP.find(x=>x.id===f.exp); modal('Reclamo de cobro',`<span class="chip ai">${ic('spark','width="11" height="11"')}Borrador asistido · revisá antes de enviar</span><div class="fld"><label for="rc">Mensaje</label><textarea id="rc" name="t" style="min-height:150px">Estimados, les recordamos que la factura ${f.nro} por ${usd(f.saldo||f.monto)}, correspondiente a "${f.hito}" del proyecto de ${e.soc}, venció el ${fdy(f.vence)}. Agradecemos coordinar el pago o indicarnos la fecha prevista. Saludos cordiales, SS Proyectos.</textarea></div>`,fd=>{f.reclamos=(f.reclamos||0)+1; toast('Reclamo registrado. Envialo desde tu correo');},'Registrar reclamo'); break; }
   case 'importar': toast('Importación: 3 facturas leídas, 0 duplicadas, 1 pendiente de asociar a hito'); break;
   case 'export': { const rows=[['Sociedad','Expediente','Ministerio','Responsable','Salud','Frescura (días)','Próxima acción','Fecha']].concat(sorted(filtered()).map(e=>{const ev=expEval(e),n=nextAction(e);return [e.soc,e.num,e.min,P(e.resp).name,SAL[ev.salud],ev.freshDays,n.t,iso(n.f)];})); const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n'); navigator.clipboard?.writeText(csv).then(()=>toast(`${rows.length-1} expedientes copiados como CSV`),()=>toast('No se pudo copiar; probá de nuevo')) || toast('Portapapeles no disponible'); break; }
   case 'nuevo': modal('Alta de expediente',`<p class="small muted">En el sistema real esto llega solo cuando comercial marca la propuesta como ganada (A14).</p><div class="fld"><label for="ns">Sociedad</label><input id="ns" name="s" required placeholder="Razón social"></div><div class="grid g2"><div class="fld"><label for="nm">Ministerio</label><select id="nm" name="m">${MIN.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="fld"><label for="nr">Responsable</label><select id="nr" name="r">${ASIS.map(id=>`<option value="${id}">${P(id).name}</option>`).join('')}</select></div></div>`,fd=>{ const e={...EXP[30],id:'E'+(2000+EXP.length),soc:fd.s,min:fd.m,sector:SECT[fd.m],resp:fd.r,estado:'En armado',grupo:null,tareas:[],bit:[{f:TODAY,tipo:'sys',t:'Expediente creado, checklist de armado instanciado',autor:P(me()).name}],num:'2026-10-1-'+ri(1000,9999)}; EXP.unshift(e); toast('Expediente creado con su checklist de armado');},'Crear'); break;
   case 'abrir-doc': toast('Se abre en SharePoint (solo lectura)'); break;
   case 'subir': toast('Archivo recibido. El equipo lo valida antes de darlo por cumplido'); break;
  }
});
document.addEventListener('change', ev => { const el=ev.target; if(el.dataset.act==='filter'){ S.f[el.dataset.k]=el.value; render(); } });
$('#q').addEventListener('input', ev => { S.q = ev.target.value; if(S.view!=='cartera'){ S.view='cartera'; } render(); $('#q').focus(); });
$('#menuBtn').onclick = () => { $('#side').classList.add('open'); document.body.classList.add('drawer'); };
$('#themeBtn').onclick = () => { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };
document.addEventListener('keydown', ev => { if(ev.key==='Escape') $('#modalRoot').innerHTML=''; });
S.login='login';
render(); renderLogin();
})();
</script>
